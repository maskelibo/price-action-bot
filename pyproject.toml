[project]
name = "price-action"
version = "0.1.0"
description = "Otonom price action swing trading şirketi — kripto MVP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Price Action Co." }]

dependencies = [
    # Core
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pydantic>=2.7",
    # CVE-floor 2026-07-10 (T6 #25): symlink-out-of-secrets_dir advisory → >=2.14.2
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "loguru>=0.7",
    "typer>=0.12",

    # Market data / execution
    "ccxt>=4.3",
    "websockets>=12.0",

    # Backtest / quant
    "vectorbt>=0.26",
    "numba>=0.59",
    "ta-lib-binary; platform_system=='Windows'",
    "pandas-ta>=0.3.14b",
    "optuna>=3.6",
    "scipy>=1.13",
    "statsmodels>=0.14",

    # ML
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    # FIX 2026-05-28 (audit-Y7): lightgbm KALDIRILDI — repo'da hiçbir
    # `import lightgbm` yok (grep doğruladı). Dead dep, 80+ MB install
    # boyutu artırıyordu, CI cache şişiyordu. Geri eklemek için gerçek
    # kullanım gerekecek.
    "joblib>=1.4",

    # LLM / Agents
    "anthropic>=0.39",
    "claude-agent-sdk>=0.1.0",
    "tiktoken>=0.7",

    # RAG
    # NOT 2026-07-10 (T6 #25): chromadb 1.5.9 = CRITICAL GHSA-f4j7-r4q5-qw2c
    # (pre-auth code injection) son-etkilenen sürüm; PyPI'da fix YOK (latest=1.5.9).
    # Embedded kullanım (server dinleyici yok) → ağ-sömürüsü N/A. Fix çıkınca >1.5.9'a bump'la.
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "youtube-transcript-api>=0.6",
    # CVE-floor 2026-07-10 (T6 #25): GHSA-69qj-pvh9-c5wg (--exec enjeksiyonu) → >=2026.6.9
    "yt-dlp>=2026.6.9",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "feedparser>=6.0",

    # API / Dashboard
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",

    # Persistence
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # Scheduler / orchestration
    "apscheduler>=3.10",
    "tenacity>=8.5",

    # Notification
    "python-telegram-bot>=21.4",

    # Observability
    "prometheus-client>=0.20",
    "structlog>=24.4",

    # Güvenlik tabanları — transitive bağımlılıklara CVE-floor (T6 #25, 2026-07-10;
    # shadow-venv'de tam suite ile doğrulandı). Doğrudan import edilmiyorlar; amaç
    # çözücünün savunmasız sürümü seçmesini engellemek.
    "cryptography>=48.0.1",     # HIGH GHSA-537c-gmf6-5ccf (wheel'de savunmasız OpenSSL, TLS yolu)
    "starlette>=1.3.1",         # HIGH GHSA-82w8-qh3p-5jfq +5 (form-DoS, method-dispatch; FastAPI tabanı)
    "aiohttp>=3.14.1",          # 12 advisory (pipelining DoS, cookie leak, digest-auth redirect)
    "python-multipart>=0.0.31", # HIGH GHSA-5rvq-cxj2-64vf (querystring DoS)
    # torch: LOW (jit.script) — OSV 2.13.0'ı temiz raporluyor; sentence-transformers
    # transitive'i. Floor bilinçli KONULMADI (ağır paket, LOW sev) — lock'ta yönet.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    # FIX 2026-05-28 (audit-Y7): hypothesis KALDIRILDI — `import hypothesis`
    # repo'da hiç yok (grep doğruladı). Property-based testing güzel ama
    # kullanılmıyorsa dev install zamanını uzatıyor. Gerekirse geri eklenir.
    "ruff>=0.5",
    "mypy>=1.11",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.23",
]

[project.scripts]
pa = "price_action.cli:main"
pa-ingest = "price_action.data.ingest_ccxt:main"
pa-backtest = "price_action.backtest.cli:main"
pa-ceo = "price_action.orchestrator.ceo_loop:main"
pa-rag = "price_action.rag.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_action"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003: "ambiguous unicode" — Türkçe harfleri (ı İ ş ç ğ ö) yanlış-pozitif
# olarak işaretliyor. Kod tabanı Türkçe-öncelikli (yorum/docstring) → ignore.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# P1-7 (2026-07-06): sizing.py pre-existing yapısal ihlaller — canlı risk
# motorunda import yeniden düzeni (E402) ve R adlandırması (N806, trading
# konvansiyonu) davranış riski taşır; dosya bazlı muaf.
"src/price_action/risk/sizing.py" = ["E402", "N806"]
# OTONOMI-1 (2026-07-07): legacy büyük dosyalar ilk kez lint'e girdi —
# pre-existing yapısal ihlaller davranış riski olmadan düzeltilemez; muaf.
"src/price_action/lab/iterate_orchestrator.py" = ["E402", "N806", "SIM102"]
"src/price_action/orchestrator/scheduler.py" = ["N806", "F841", "SIM105", "SIM115", "N814", "F401"]
# F1-fix (2026-07-07): canlı scan dosyası ilk kez lint'e girdi — E402 import
# sırası (sys.path/env kurulumu importlardan önce ŞART) + trading konvansiyonu.
"scripts/futures_trade_15m.py" = ["E402", "N806", "N814", "SIM105"]
# Kill-kriteri fix (2026-07-07): bot_monitor ilk kez lint'e girdi — pre-existing.
"src/price_action/agents/bot_monitor.py" = ["B007", "RUF005", "SIM105"]
# Emanet-commit (2026-07-07): canlı god-file + rapor script'leri ilk lint —
# pre-existing yapısal ihlaller; canlı dosyada davranış riski alınmaz.
"scripts/futures_daemon.py" = ["E402", "E731", "N806", "N811", "N814", "SIM105", "SIM118"]
"scripts/truth_report.py" = ["RUF005"]
"tests/audit/test_audit_findings.py" = ["F841", "N812"]
# C1 (2026-07-10): dosya ilk kez lint'e girdi — pre-existing ihlaller
# (LLMError isimli testler N802, os-skip importu E402/I001, mock artıkları
# F401/F841); davranış-nötr muaf. Yeni C1 testleri bu kodları ihlal etmiyor.
"tests/test_agents_cli.py" = ["E402", "I001", "F401", "F841", "N802"]
# Save-4 (2026-07-07): dashboard ilk kez git'e girdi — pre-existing muaf.
"scripts/dashboard/collect.py" = ["E402"]
"scripts/dashboard/server.py" = ["SIM105"]
# Batch-3 (2026-07-07): ilk-lint pre-existing ihlaller (davranış-nötr muaf).
"src/price_action/agents/adversary_engineer.py" = ["N806", "SIM102", "SIM105"]
"src/price_action/agents/lab_scientist.py" = ["N806"]
"src/price_action/execution/post_only_router.py" = ["SIM105"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
markers = [
    "slow: yavaş test (>5s)",
    "integration: dış servis gerektirir",
    "live: gerçek borsa çağırır (CI'da skip)",
]

[tool.coverage.run]
source = ["src/price_action"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
