[project]
name = "price-action"
version = "0.1.0"
description = "Otonom price action swing trading şirketi — kripto MVP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Price Action Co." }]

dependencies = [
    # Core
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "loguru>=0.7",
    "typer>=0.12",

    # Market data / execution
    "ccxt>=4.3",
    "websockets>=12.0",

    # Backtest / quant
    "vectorbt>=0.26",
    "numba>=0.59",
    "ta-lib-binary; platform_system=='Windows'",
    "pandas-ta>=0.3.14b",
    "optuna>=3.6",
    "scipy>=1.13",
    "statsmodels>=0.14",

    # ML
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    # FIX 2026-05-28 (audit-Y7): lightgbm KALDIRILDI — repo'da hiçbir
    # `import lightgbm` yok (grep doğruladı). Dead dep, 80+ MB install
    # boyutu artırıyordu, CI cache şişiyordu. Geri eklemek için gerçek
    # kullanım gerekecek.
    "joblib>=1.4",

    # LLM / Agents
    "anthropic>=0.39",
    "claude-agent-sdk>=0.1.0",
    "tiktoken>=0.7",

    # RAG
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "youtube-transcript-api>=0.6",
    "yt-dlp>=2024.7.16",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "feedparser>=6.0",

    # API / Dashboard
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",

    # Persistence
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # Scheduler / orchestration
    "apscheduler>=3.10",
    "tenacity>=8.5",

    # Notification
    "python-telegram-bot>=21.4",

    # Observability
    "prometheus-client>=0.20",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    # FIX 2026-05-28 (audit-Y7): hypothesis KALDIRILDI — `import hypothesis`
    # repo'da hiç yok (grep doğruladı). Property-based testing güzel ama
    # kullanılmıyorsa dev install zamanını uzatıyor. Gerekirse geri eklenir.
    "ruff>=0.5",
    "mypy>=1.11",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.23",
]

[project.scripts]
pa = "price_action.cli:main"
pa-ingest = "price_action.data.ingest_ccxt:main"
pa-backtest = "price_action.backtest.cli:main"
pa-ceo = "price_action.orchestrator.ceo_loop:main"
pa-rag = "price_action.rag.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_action"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003: "ambiguous unicode" — Türkçe harfleri (ı İ ş ç ğ ö) yanlış-pozitif
# olarak işaretliyor. Kod tabanı Türkçe-öncelikli (yorum/docstring) → ignore.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# P1-7 (2026-07-06): sizing.py pre-existing yapısal ihlaller — canlı risk
# motorunda import yeniden düzeni (E402) ve R adlandırması (N806, trading
# konvansiyonu) davranış riski taşır; dosya bazlı muaf.
"src/price_action/risk/sizing.py" = ["E402", "N806"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
markers = [
    "slow: yavaş test (>5s)",
    "integration: dış servis gerektirir",
    "live: gerçek borsa çağırır (CI'da skip)",
]

[tool.coverage.run]
source = ["src/price_action"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
