# RAG Corpus Seed List
# Lab haftalık olarak yeni kaynak ekler. Her ekleme insan onayı ile.
# Telif: kitap full text dahil edilmez; sadece kullanıcı tarafından legal olarak edinilen
# ya da açık yayın notlar/özetler ingest edilir.

categories:
  - id: classic_pa
    description: Klasik price action — Brooks, Volman, Grimes
  - id: structure_smc
    description: Smart Money Concepts, ICT, Wyckoff
  - id: market_microstructure
    description: Borsa, order flow, market making
  - id: risk_management
    description: Pozisyon sizing, kelly, anti-fragility
  - id: quant_finance
    description: arXiv / SSRN akademik
  - id: ml_for_trading
    description: ML/RL for trading
  - id: trading_psychology
    description: Davranışsal finans
  - id: trading_firm_blogs
    description: Two Sigma, Jane Street, JP Morgan tech blog
  - id: regimes
    description: Piyasa rejimleri ve geçişleri

# === Kitaplar (özet/not yapısı; full text yasak) ===
books:
  - id: brooks_pa_trading
    title: Reading Price Charts Bar by Bar
    author: Al Brooks
    category: classic_pa
    type: reference_only          # full text yok
    notes_path: books/brooks_summary.md
    quality: 5

  - id: volman_pa
    title: Forex Price Action Scalping
    author: Bob Volman
    category: classic_pa
    type: reference_only
    notes_path: books/volman_summary.md
    quality: 5

  - id: grimes_art_and_science
    title: The Art and Science of Technical Analysis
    author: Adam Grimes
    category: classic_pa
    type: reference_only
    notes_path: books/grimes_summary.md
    quality: 5

  - id: kaufman_trading_systems
    title: Trading Systems and Methods
    author: Perry Kaufman
    category: quant_finance
    type: reference_only
    notes_path: books/kaufman_summary.md
    quality: 5

  - id: wyckoff_method
    title: The Wyckoff Methodology
    author: Various
    category: structure_smc
    type: reference_only
    notes_path: books/wyckoff_summary.md
    quality: 4

  - id: chan_quant_trading
    title: Algorithmic Trading
    author: Ernest Chan
    category: quant_finance
    type: reference_only
    notes_path: books/chan_summary.md
    quality: 5

  - id: lopez_marcos
    title: Advances in Financial Machine Learning
    author: Marcos López de Prado
    category: ml_for_trading
    type: reference_only
    notes_path: books/lopez_summary.md
    quality: 5

