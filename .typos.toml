"konfigürasyon" = "konfigürasyon"
"sermaye" = "sermaye"
"Pazar" = "Pazar"
"Pazartesi" = "Pazartesi"
"Çarşamba" = "Çarşamba"
# Trading terimleri
"OHLCV" = "OHLCV"
"FVG" = "FVG"
"ATR" = "ATR"
"EMA" = "EMA"
"RSI" = "RSI"
"VWAP" = "VWAP"
"AVWAP" = "AVWAP"
"VSA" = "VSA"
"SC" = "SC"  # Selling Climax
"BC" = "BC"  # Buying Climax
