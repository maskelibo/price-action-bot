name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # FIX 2026-05-28 (Faz 14.27 C7): nightly CI — main'in günlük sağlığı
  schedule:
    - cron: "0 6 * * *"   # Her gün 06:00 UTC (09:00 TR)

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: WARNING
      LOG_FORMAT: plain
      # Network-bağımlı testleri default'ta kapalı tut
      PA_RUN_INTEGRATION: ""
      PA_RUN_LIVE: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CI-light deps — heavy compiled paketler (ta-lib-binary, vectorbt) atlanır.
          pip install \
            "numpy>=1.26" "pandas>=2.2" "pyarrow>=15" "duckdb>=1.0" \
            "pydantic>=2.7" "pydantic-settings>=2.3" "pyyaml>=6.0" \
            "python-dotenv>=1.0" "rich>=13.7" "loguru>=0.7" "typer>=0.12" \
            "ccxt>=4.3" \
            "scipy>=1.13" "statsmodels>=0.14" \
            "scikit-learn>=1.5" "xgboost>=2.1" "joblib>=1.4" \
            "fastapi>=0.111" "uvicorn[standard]>=0.30" "jinja2>=3.1" \
            "sqlalchemy>=2.0" "prometheus-client>=0.20" \
            "httpx>=0.27" \
            "pytest>=8.3" "pytest-cov>=5.0" "ruff>=0.5" "mypy>=1.11"

      - name: Ruff (repo-wide — INFORMATIONAL, exit code visible)
        id: ruff_repo
        continue-on-error: true
        run: |
          set +e
          ruff check src scripts tests 2>&1 | tee ruff_repo.txt
          _ec=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$_ec" >> "$GITHUB_OUTPUT"
          echo "### Repo-wide Ruff (informational): exit=$_ec" >> "$GITHUB_STEP_SUMMARY"
          if [ "$_ec" -ne 0 ]; then
            echo "::warning::Repo-wide Ruff baseline is not clean (exit=$_ec); targeted gate remains blocking."
          fi
          exit "$_ec"

      - name: Ruff (runtime safety surface — blocking)
        run: |
          ruff check \
            src/price_action/execution/e13_shadow.py \
            src/price_action/execution/e13_shadow_sync.py \
            src/price_action/execution/dead_mans_switch.py \
            src/price_action/execution/pyramid_router.py \
            src/price_action/execution/post_only_router.py \
            src/price_action/execution/slippage_tracker.py \
            src/price_action/risk/vol_target.py \
            scripts/futures_daemon.py \
            scripts/futures_daemon_v14.py \
            scripts/futures_trade_15m.py \
            scripts/futures_trade_daily.py \
            scripts/process_pending_entries.py \
            scripts/ingest_15m_live.py \
            scripts/e13_shadow_tick.py \
            scripts/e13_exit_evidence.py \
            scripts/dashboard/collect.py \
            tests/execution/test_15m_daemon.py \
            tests/execution/test_15m_stale_data_fail_closed.py \
            tests/execution/test_dead_mans_switch.py \
            tests/execution/test_daily_execution_disabled.py \
            tests/execution/test_e13_exit_evidence.py \
            tests/execution/test_e13_shadow_sync.py \
            tests/execution/test_post_only_router.py \
            tests/execution/test_protection_exit_lifecycle.py \
            tests/execution/test_rate_limit_scoped_state.py \
            tests/test_pending_retry_finalize.py \
            tests/ops/test_dashboard_local_evidence.py \
            tests/ops/test_dashboard_ops_health.py \
            tests/ops/test_restore_duckdb.py \
            tests/ops/test_ops_fail_visible.py \
            tests/test_ingest_snapshot_publish.py

      - name: Mypy (analytics + ml + api)
        run: |
          mypy --install-types --non-interactive src/price_action/analytics src/price_action/ml src/price_action/api src/price_action/cli.py || true

      # These tests are a blocking functional gate. Whole-package coverage is
      # measured separately and remains informational until the baseline can
      # honestly satisfy the configured 70% target.
      - name: Pytest (core 6 + faz14.27 — blocking)
        run: |
          pytest tests/test_kpi.py tests/test_journal.py tests/test_drift.py \
                 tests/test_postmortem.py tests/test_api.py tests/test_cli.py \
                 tests/test_faz14_27_audit_fixes.py \
                 -v --maxfail=5

      - name: Coverage (whole package — INFORMATIONAL, 70% target visible)
        id: coverage_info
        continue-on-error: true
        run: |
          set +e
          pytest tests/test_kpi.py tests/test_journal.py tests/test_drift.py \
                 tests/test_postmortem.py tests/test_api.py tests/test_cli.py \
                 tests/test_faz14_27_audit_fixes.py \
                 --cov=src/price_action \
                 --cov-report=term-missing:skip-covered \
                 --cov-report=xml \
                 --cov-fail-under=70 \
                 -q 2>&1 | tee coverage_results.txt
          _ec=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$_ec" >> "$GITHUB_OUTPUT"
          echo "### Whole-package coverage (informational): exit=$_ec, target=70%" >> "$GITHUB_STEP_SUMMARY"
          if [ "$_ec" -ne 0 ]; then
            echo "::warning::Whole-package coverage target is not yet met (exit=$_ec)."
          fi
          exit "$_ec"

      - name: Upload lint and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-and-coverage-evidence
          path: |
            ruff_repo.txt
            coverage_results.txt
            coverage.xml
          retention-days: 14

      # Canlı emir, retry/protection, risk, DR ve Codex geçişindeki yeni
      # regresyonlar informational full-suite'e bırakılamaz. Bu liste blocking
      # tutulur; dosyalardan biri kırılırsa PR/push job'u kırmızı olur.
      - name: Pytest (safety-critical regressions — blocking)
        run: |
          pytest -q \
            tests/test_v14_protection_wiring.py \
            tests/execution/test_15m_daemon.py \
            tests/execution/test_15m_stale_data_fail_closed.py \
            tests/execution/test_dead_mans_switch.py \
            tests/execution/test_w1_lifecycle_fixes.py \
            tests/execution/test_daily_execution_disabled.py \
            tests/execution/test_pyramid_router.py \
            tests/execution/test_pyramid_be_protect.py \
            tests/execution/test_post_only_router.py \
            tests/test_pending_retry_finalize.py \
            tests/test_slippage_measurement_fix.py \
            tests/test_equity_snapshot_15m.py \
            tests/execution/test_slippage_tracker_tf.py \
            tests/execution/test_binance_rate_limit_guard.py \
            tests/execution/test_protection_exit_lifecycle.py \
            tests/execution/test_rate_limit_scoped_state.py \
            tests/risk/test_live_vol_target_sizing.py \
            tests/ops/test_backup_manifest.py \
            tests/ops/test_backup_retention.py \
            tests/ops/test_restore_duckdb.py \
            tests/ops/test_dashboard_local_evidence.py \
            tests/ops/test_dashboard_ops_health.py \
            tests/ops/test_ops_fail_visible.py \
            tests/test_ingest_snapshot_publish.py \
            tests/execution/test_e13_exit_evidence.py \
            tests/execution/test_e13_shadow_sync.py \
            tests/test_codex_agent_parity.py \
            tests/test_codex_skill_compat.py \
            tests/test_agent_output_eval.py

      - name: Codex agent generation drift (blocking)
        run: python scripts/generate_codex_agents.py --check

      # FIX 2026-05-28 (audit-A10): full suite eskiden `|| true` + `continue-on-error: true`
      # ikilisi ile SESSİZ FAIL ediyordu — "CI passed" yalan beyan üretiyordu.
      # Yeni yapı:
      #   1) `--co` (collect-only) zaten yukarıdaki `Pytest (core)` step'i içinde değil,
      #      ama buradaki ilk `--co -q` collection-only'di → kaldırıldı (collection
      #      her zaman geçer, yanıltıcı).
      #   2) Gerçek pytest çağrısı dosyaya tee'lenecek, çıktı görünür.
      #   3) `continue-on-error: true` korunuyor (full suite henüz green değil)
      #      ama `|| true` kaldırıldı → exit code görünür hâlde job summary'e düşecek.
      #   4) Artifact upload: test_results.txt → failure forensics.
      - name: Pytest (full suite — INFORMATIONAL, exit code görünür)
        id: pytest_full
        run: |
          set +e
          pytest tests/ \
            --ignore=tests/test_ml_meta_labeler.py \
            --ignore=tests/test_xgboost_features.py \
            --maxfail=20 -q 2>&1 | tee test_results_full.txt
          _ec=${PIPESTATUS[0]}
          echo "pytest_full_exit_code=$_ec" >> "$GITHUB_OUTPUT"
          echo "----- exit code: $_ec -----"
          if [ "$_ec" -ne 0 ]; then
            echo "::warning::Full suite exit=$_ec (informational, not blocking core)"
          fi
          exit "$_ec"
        continue-on-error: true

      - name: Upload full-suite test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-test-results
          path: test_results_full.txt
          retention-days: 14

  integration-tests:
    # FIX 2026-05-28 (audit-Y6): integration test'ler ayrı job, informational.
    # Önceki bug: conftest.py PA_RUN_INTEGRATION yokken integration'ları SKIP
    # ediyordu; CI'de bu env hiç set değildi → integration testler hiç
    # koşmuyordu (silent landmine — yeni breaker entegrasyonu broken görünür
    # ama CI green). Şimdi: ayrı job, network errors olabilir, blocking değil
    # ama exit code ve artifact görünür.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test  # core PASS sonrası

    env:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: WARNING
      PA_RUN_INTEGRATION: "1"
      PA_RUN_LIVE: ""

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps (CI light)
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy>=1.26" "pandas>=2.2" "pyarrow>=15" "duckdb>=1.0" \
            "pydantic>=2.7" "pydantic-settings>=2.3" "pyyaml>=6.0" \
            "loguru>=0.7" "pytest>=8.3" "pytest-asyncio"
      - name: Integration tests (informational, network may fail)
        id: integration
        continue-on-error: true
        run: |
          set +e
          pytest tests/ -m integration -v --tb=short 2>&1 | tee integration_results.txt
          _ec=${PIPESTATUS[0]}
          echo "exit_code=$_ec" >> "$GITHUB_OUTPUT"
          if [ "$_ec" -ne 0 ]; then
            echo "::warning::Integration tests exit=$_ec (informational)"
          fi
          exit 0
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration_results.txt
          retention-days: 14

  security:
    # FIX 2026-05-28 (Faz 14.27 C7): Security scanning jobu.
    # Önceki bug: bandit/pip-audit YOKTU → secret leak veya CVE riski silent.
    # Bandit: Python kod güvenlik tarama (hardcoded secret, sql inj, vs).
    # pip-audit: dependency CVE tarama (PyPI advisory DB).
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit

      - name: Bandit (runtime-critical surface — HIGH blocking)
        run: |
          set +e
          bandit -r \
            src \
            scripts/futures_daemon.py \
            scripts/futures_daemon_v14.py \
            scripts/futures_trade_15m.py \
            scripts/futures_trade_daily.py \
            scripts/process_pending_entries.py \
            scripts/e13_shadow_tick.py \
            scripts/e13_exit_evidence.py \
            scripts/dashboard \
            --severity-level high -f json -o bandit_runtime_report.json
          bandit_rc=$?
          set -e
          if [ "$bandit_rc" -gt 1 ]; then
            echo "Bandit scanner failed with rc=$bandit_rc"
            exit "$bandit_rc"
          fi
          python - <<'PY'
          import json
          import sys

          with open("bandit_runtime_report.json", encoding="utf-8") as fh:
              report = json.load(fh)
          totals = report.get("metrics", {}).get("_totals", {})
          loc = int(totals.get("loc", 0) or 0)
          results = report.get("results", [])
          errors = report.get("errors", [])
          if loc <= 0:
              raise SystemExit("Bandit false-green guard: scanned LOC is zero")
          if errors:
              raise SystemExit(f"Bandit scan errors: {errors}")
          high = [r for r in results if r.get("issue_severity") == "HIGH"]
          print(f"Bandit runtime scanned_loc={loc} high={len(high)}")
          for issue in high:
              print(
                  f"HIGH {issue.get('test_id')} {issue.get('filename')}:"
                  f"{issue.get('line_number')} {issue.get('issue_text')}"
              )
          if high:
              sys.exit(1)
          PY
        continue-on-error: false

      - name: Bandit (src + all scripts — INFORMATIONAL, visible)
        id: bandit_broad
        continue-on-error: true
        run: |
          set +e
          bandit -r src scripts --severity-level medium -f json -o bandit_broad_report.json
          bandit_rc=$?
          set -e
          python - <<'PY'
          import json

          with open("bandit_broad_report.json", encoding="utf-8") as fh:
              report = json.load(fh)
          totals = report.get("metrics", {}).get("_totals", {})
          loc = int(totals.get("loc", 0) or 0)
          results = report.get("results", [])
          errors = report.get("errors", [])
          if loc <= 0:
              raise SystemExit("Bandit broad false-green guard: scanned LOC is zero")
          if errors:
              raise SystemExit(f"Bandit broad scan errors: {errors}")
          high = sum(r.get("issue_severity") == "HIGH" for r in results)
          medium = sum(r.get("issue_severity") == "MEDIUM" for r in results)
          print(f"Bandit broad scanned_loc={loc} medium={medium} high={high}")
          PY
          echo "exit_code=$bandit_rc" >> "$GITHUB_OUTPUT"
          echo "### Broad Bandit (informational): exit=$bandit_rc" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bandit_rc" -ne 0 ]; then
            echo "::warning::Broad Bandit has findings (exit=$bandit_rc); see artifact."
          fi
          exit "$bandit_rc"

      - name: Install project for pip-audit (blocking setup)
        run: |
          set -euo pipefail
          pip install -e '.[dev]' 2>&1 | tee pip_audit_install.log

      - name: pip-audit (CVE findings — INFORMATIONAL, visible)
        # The project-install step above is blocking. Only dependency findings
        # are non-blocking while their real exit code remains visible.
        continue-on-error: true
        run: |
          set +e
          pip-audit --desc -f json -o pip_audit.json
          audit_rc=$?
          set -e
          echo "### pip-audit (informational): exit=$audit_rc" >> "$GITHUB_STEP_SUMMARY"
          if [ "$audit_rc" -ne 0 ]; then
            echo "::warning::pip-audit reported findings or an audit error (exit=$audit_rc)."
          fi
          exit "$audit_rc"

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit_runtime_report.json
            bandit_broad_report.json
            pip_audit.json
            pip_audit_install.log
          retention-days: 30

  pool-verify:
    # SEC54.5: SEC53 pool reproducibility gate (DQ-05 / RP-01).
    # Pool file (data/sec53_15m_pool_v11.pkl) yoksa skip edilir (CI'da beklenir).
    # Mevcut olduğunda 12/12 PASS zorunlu; fail → CI red.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: WARNING
      LOG_FORMAT: plain

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy>=1.26" "pandas>=2.2" "pyarrow>=15" "duckdb>=1.0" \
            "pydantic>=2.7" "pydantic-settings>=2.3" "pyyaml>=6.0" \
            "python-dotenv>=1.0" "loguru>=0.7"

      - name: Pool verify (skip if pool file absent)
        run: |
          if [ -f "data/sec53_15m_pool_v11.pkl" ]; then
            python scripts/verify_sec53_pool.py
          else
            echo "[SKIP] Pool file not present in CI (expected — large binary not in repo)."
            echo "Run locally: python scripts/verify_sec53_pool.py"
          fi
