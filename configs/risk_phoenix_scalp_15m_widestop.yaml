# G9 FIX (hard review 2026-05-21): close_pct değerleri GERÇEĞE hizalandı.
# ÖNCE bu blok 40/30/30 diyordu; backtest engine 30/30/40 kullanıyor; canlı
# `place_protection_orders` 25/25/50 kullanıyor — 3 farklı gerçek vardı.
# Aşağıdaki değerler CANLI gerçeğe (25/25/50) hizalandı ki dökümantasyon
