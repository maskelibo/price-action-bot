# =============================================================================
# SEC54.6d — Per-Strategy Regime Conditional Filter (2026-05-19 live wiring)
# =============================================================================
# Backtest: annual +1935.9% / neg 8/61 / mandate 5/5 (vs baseline +1283.2% / neg 9/61)
# Pre-reg: memory/researcher/hypotheses/2026-05-18-regime-conditional-filters.md
# Researcher report: reports/researcher/2026-05-19_sec54_6d_regime_filter.md
#
# CAUSAL GUARANTEE: Features file (data/regime_features_latest.parquet) written
# daily at 00:01 UTC by scripts/regime_features_refresh.py using t-1 BTC daily
# close data. Signal timestamp t → features lookup date t-1 (shift already in
# parquet writer, no additional shift needed in RiskOfficer).
#
# FAIL-SAFE: features stale (>24h) or missing → ALLOW (false-negative accepted).
# BACKWARD COMPAT: enabled: false → byte-identical behavior (1d Phoenix unaffected).
# PA_LIVE_CONFIRM NOT SET: code + test only. Live activation = Principal sign-off.
# =============================================================================
regime_filter_per_strategy:
  enabled: true
  features_max_age_hours: 24    # stale → fail-safe ALLOW (conservative)
  features_path: data/regime_features_latest.parquet
  # G5 FIX (hard review 2026-05-21): regime cache staleness tier'leri.
  # ÖNCE blok yoktu → CacheFreshnessConfig defaults (warn 24h / reject 48h) devreye
  # girip features_max_age_hours=24 ile uyumsuzdu (24h/48h vs 24h eşik çelişkisi).
  # 15m bot için sıkılaştırıldı: regime features cron'u 00:01 UTC günlük yazıyor,
  # 15m TF'de 1 günden eski rejim verisi ile trade etmek riskli.
  # Consuming code: regime_filter.py CacheFreshnessConfig.from_cfg()
  #   YAML path = regime_filter_per_strategy.cache_freshness
  #   keys: warn_hours / reject_hours / hard_reject_hours / grace_minutes / strict_mode
  cache_freshness:
    warn_hours: 6              # 6h sonrası ALLOW + WARN log + Telegram
    reject_hours: 24           # 24h sonrası tüm sinyaller REJECT
    hard_reject_hours: 48      # 48h sonrası REJECT + critical alarm
    grace_minutes: 30          # cron jitter buffer (geç çalışan cron tier atlamasın)
    strict_mode: true          # MISSING parquet → REJECT (fail-closed)
  filters:
    # F1: anchored_vwap_reversal — range rejim skip (both sides)
    # Forensic: 2025-04 AVWAP -%560, WR %11.8, BTC ATR%<4% sıkışık range
    # Backtest contribution: -1 neg ay, +56pp annual (F1 alone, B fee=+8)
    F1_avwap_range:
      strategy: anchored_vwap_reversal
      side: BOTH
      btc_atr_pct_lt: 3.0               # BTC ATR%_30d < 3% → range rejim
      btc_return_30d_abs_lt_pct: 3.0    # |return_30d| < 3% → flat, not trending
    # F2: brooks_failed_breakout — SHORT only — strong bull skip
    # Forensic: 2025-05 brooks_fb short -%645, BTC +%8.4 EMA200 above
    # Backtest contribution: +1 neg ay (worsened count) BUT +602pp annual alpha
    # (correctly skipping failed short setups in strong bull regime)
    F2_brooks_fb_bull:
      strategy: brooks_failed_breakout
      side: SHORT
      btc_ema200_above: true
      btc_return_30d_gt_pct: 5.0        # BTC 30g return > +5% → strong bull
    # F3: vsa_climax_test — LONG only — deep bear capitulation skip
    # Forensic: 2026-02 vsa long XRP -%57, BTC -%13, F&G=10
    # Backtest contribution: -1 neg ay, +114pp annual (F3 alone)
    F3_vsa_bear:
      strategy: vsa_climax_test
      side: LONG
      btc_fng_lt: 15                    # F&G extreme fear < 15
      btc_return_30d_lt_pct: -10.0      # BTC 30g return < -10% → deep bear
    # F4: engulfing_continuation — both sides — extreme vol skip
    # Forensic: 2023-06 engulfing -%143, high-vol rejim
    # Backtest contribution: null alone (-94pp) but neutral/combo (+653pp net)
    F4_engulfing_high_vol:
      strategy: engulfing_continuation
      side: BOTH
      btc_realized_vol_7d_annualized_gt_pct: 100.0  # 7g realized vol > 100% ann

