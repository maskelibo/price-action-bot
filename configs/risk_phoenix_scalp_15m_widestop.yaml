exit_engine:   # DEAD CONFIG — hiçbir kod okumuyor (hard review 2026-05-21)
  multi_target: true
  # G9: canlı place_protection_orders gerçeği = TP1 %25 / TP2 %25 / runner %50
  partial_close_1R: 0.25         # canlı reality (ÖNCE 0.40 — yanlış)
  partial_close_2R: 0.25         # canlı reality (ÖNCE 0.30 — yanlış)
  runner_pct: 0.50               # canlı reality (ÖNCE 0.30 — yanlış)
  break_even_after_1R: true
  lock_1R_after_2R: true
  runner_trail_atr: 0.7          # 1d 1.0 → 0.7 (daha sıkı trailing scalp'
