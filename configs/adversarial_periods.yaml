#   2. Stress test PASS/FAIL eşikleri
#   3. Pre-deploy kill-probe gate'leri (overfit/cherry-pick detection)
#
# Principal değiştirebilir; agent okur ve uygular.
# Eklemek istenen yeni period için: id, name, start, end, description, severity.

