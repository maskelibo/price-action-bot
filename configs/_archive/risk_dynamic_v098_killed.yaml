# Risk Management — v0.9.8 DYNAMIC PRESET
# BALANCED (halt + F&G short-skip) + CONFIDENCE-BASED dynamic sizing & leverage
#
# YENI v0.9.8:
#   - use_confidence_dynamic_sizing: true (master flag)
#   - use_conf_percentile: true (rolling 180g percentile rank ile re-normalize)
#   - confidence_risk_tiers genisletildi: %2 / %4 / %6 / %7 (top tier 10/10 sinyal)
#   - leverage tiers: 3x / 4x / 5x (yuksek conf'da yuksek lev)
#
# Mantik: 10/10 checklist = top %5 = %7 risk + 5x leverage (BUYUK POZISYON)
#         Tek pattern = bottom %50 = %2 risk + 3x leverage (KUCUK POZISYON)
# Kullanici intent: "guvenli sinyallere buyuk bas, riskli sinyallere kucuk gir"

defaults:
  account_currency: USDT
  preset_name: dynamic

position_sizing:
  method: confidence_dynamic       # v0.9.8 — gerçekten dinamik (replay'de tier'lar aktif)
  risk_per_trade: 0.04             # tier MATCH etmezse fallback
  backtest_risk_pct: 0.040
  # v0.9.8 MASTER FLAG: confidence_risk_tiers + leverage_tiers ACTIVE
  use_confidence_dynamic_sizing: true
  # v0.9.8: percentile rank ile conf yeniden normalize (180g rolling)
  use_conf_percentile: true
  conf_pct_lookback_days: 180
  # Dinamik risk tier'lari — conf_pct'a (0-1 rolling rank) gore
  confidence_risk_tiers:
    - {min: 0.00, max: 0.50, risk_pct: 0.020}  # %2 — alt %50 (basit pattern)
    - {min: 0.50, max: 0.75, risk_pct: 0.040}  # %4 — orta %25 (saglam pattern)
    - {min: 0.75, max: 0.90, risk_pct: 0.060}  # %6 — ust %15 (cok iyi pattern)
    - {min: 0.90, max: 1.01, risk_pct: 0.070}  # %7 — top %10 (10/10 checklist)
  kelly_cap: 0.25
  min_quantity_usdt: 20
  size_rounding: exchange_step
  max_notional_pct_equity: 0.30

stop_loss:
  method: atr                       # atr | structural | hybrid
  atr_period: 14
  atr_multiplier: 2.0
  structural_buffer_pct: 0.005      # swing low altına %0.5 tampon
  trailing:
    enabled: true
    method: atr_chandelier
    atr_period: 14
    multiplier: 3.0
    activate_after_R: 1.0           # 1R kâra geldikten sonra trailing açık

take_profit:
  method: r_multiple                # r_multiple | atr | structural
  primary_R: 2.0                    # 2R hedefte yarısı kapansın
  partial_close_at_R: 1.0           # 1R'da %50 kapat
  runner_trail: true                # kalan trailing ile

# Volatility-targeted sizing — opsiyonel kayıp koruma katmanı.
# Aktif olunca: yüksek-vol günlerde otomatik küçük pozisyon, düşük-vol günlerde büyük.
# Test sonucu: yıllar arası tutarlılık 1.7x iyileşti (σ %35→%21), getiri %32 (vs %36 baseline).
# Default kapalı; hazır olunca enable: true ile aç.
vol_target:
  enabled: false                    # production-ready ama default kapalı
  target_atr_pct: 0.04              # %4 günlük ATR hedef (BTC normal seviyesi)
  min_factor: 0.20                  # extreme high-vol max %80 size azaltma
  max_factor: 1.50                  # extreme low-vol max %50 size büyütme

leverage:
  enabled: true
  max_leverage_per_symbol: 5
  max_portfolio_notional_x_equity: 5
  margin_safety_ratio: 0.5
  default_leverage: 3.0             # tier match etmezse fallback
  # v0.9.8: conf_pct'a gore dinamik leverage (yuksek conf -> yuksek lev)
  confidence_tiers:
    - {min: 0.00, max: 0.50, leverage: 3}     # alt %50: 3x lev
    - {min: 0.50, max: 0.75, leverage: 4}     # orta %25: 4x lev
    - {min: 0.75, max: 1.01, leverage: 5}     # ust %25: 5x lev (max)

drawdown_breakers:
  daily_loss_pct: 0.05              # günlük net kayıp %5 → durdur
  weekly_loss_pct: 0.10             # haftalık %10 → durdur
  monthly_loss_pct: 0.15            # aylık %15 → durdur
  consecutive_losses: 3             # v0.9.1: 6 -> 3 (sweep'te ROI+DD iyilestirir)
  consecutive_loss_pause_days: 5    # v0.9.1: 3 ardisik kayip -> 5 gun cool-down
  reset:
    daily: 00:00 UTC
    weekly: Monday 00:00 UTC
    monthly: 1st 00:00 UTC

correlation_gate:
  enabled: true
  max_pairwise_corr: 0.7            # 90-günlük getiri korelasyonu
  reduction_factor: 0.5             # >0.7 ise size yarıya iner
  hard_block_at: 0.9                # %90+ — pozisyonu reddet

concentration_limits:
  max_open_positions: 8
  max_per_category_pct: 0.40        # tek kategori %40'tan fazla olamaz
  max_per_symbol_pct: 0.20          # tek sembol %20'den fazla olamaz
  # v0.9.3 PRESETS: backtest'te concentration_gate'i uygula (live'a yakin simulasyon).
  # production risk.yaml'da false — eski sayilarin uyumlulugunu korur.
  backtest_apply_concentration_gate: true

# v0.9.4 REGIME FILTER (Analyst HYP — capitulation halt)
# Backtest sweep onayli: BASELINE r%4'a halt ekleyince dispersiyon yariya iniyor.
# Min pencere yillik +%3.4 -> +%19.8 (6x), DD -%37 -> -%30.
regime_filter:
  btc_capitulation_halt_enabled: true
  atr_pct_threshold: 6.0           # 1d ATR / close * 100 >= %6
  ema200_streak_days: 10           # BTC < EMA200 son 10 gun
  dd_90d_threshold_pct: -25.0      # BTC 90d max-DD <= -%25
  # Resume: ATR% <= 4 AND BTC > EMA50 5 gun consec
  resume_atr_threshold: 4.0
  resume_streak_days: 5

# v0.9.7 ALT-DATA F&G FILTER (B3 sweep WIN-WIN)
# Fear&Greed value <=20 (extreme fear) -> short skip (contrarian)
# Etki: ROI +%3pp, DD aynı, dispersiyon dar kalır.
# Funding filter B0'da YOK (SUPER preset'te var, BALANCED'da F&G yeterli).
alt_data:
  fng_short_skip_enabled: true
  fng_short_skip_threshold: 20      # value <=20 -> short skip
  funding_filter_enabled: false     # BALANCED'da kapalı, F&G yeterli

# v0.9 — 11 sembol + Top 10 strateji + multi-target engine + 1.0 ATR trail
strategy_portfolio:
  enabled: true
  symbols:                          # 11 sembol (DOGE/XRP/MATIC eklendi)
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - ADA/USDT
    - AVAX/USDT
    - LINK/USDT
    - DOT/USDT
    - DOGE/USDT
    - XRP/USDT
    - MATIC/USDT
  strategies:                       # Top 10 — 11 sembolde test edilmis
    - engulfing_continuation
    - obv_engulfing_confluence
    - anchored_vwap_reversal        # YENI v0.9 — VWAP reversal
    - wyckoff_phase_d
    - brooks_h2_l2
    - pin_bar_round_numbers
    - equal_highs_sweep
    - cvd_spike_fade                # YENI v0.9 — CVD divergence
    - vsa_climax_test               # YENI v0.9 — VSA climax
    - brooks_failed_breakout
  same_symbol_side_cooldown_days: 3
  max_concurrent_positions: 8
  signal_confidence_min: 0.20
  expected_annual_return: 0.40      # v0.9.8 DYNAMIC: TBD (sweep ile dogrulanacak)
  expected_max_dd: 0.30              # v0.9.8 DYNAMIC: TBD
  # 3y rolling stress (13 pencere — GERCEK referans):
  #   no cap (v0.9.1)        : yillik +%57.3, DD -%78 (baseline)
  #   cap 0.20               : yillik +%40.4, DD -%54 (siki, ROI dustu)
  #   cap 0.30 (production)  : yillik +%57.1, DD -%65 ⭐ (DD %13pp iyi)
  #   cap 0.50               : yillik +%96.4, DD -%77 (yuksek dispersiyon, guvensiz)
  # 5y in-sample tek pencere (referans ama yaniltici olabilir):
  #   cap 0.30 -> yillik %97.6 DD -%59 (sansa bagli, 3y rolling ile celiskili)

# v0.9 multi-target TP engine (1.0 ATR trail)
exit_engine:
  multi_target: true
  partial_close_1R: 0.30
  partial_close_2R: 0.30
  runner_pct: 0.40
  break_even_after_1R: true
  lock_1R_after_2R: true
  runner_trail_atr: 1.0             # v0.9: 0.7 -> 1.0 (let-run gevsek)

liquidity_gate:
  max_order_to_minute_volume: 0.01  # 1-dk hacmin %1'i tavanı
  min_book_depth_usdt: 100_000      # ±%1 derinlik tavanı

execution:
  order_type_default: post_only_limit
  fallback_to_market_after_sec: 30
  max_slippage_bps: 25              # 25 bps üstü → reject
  partial_fill_timeout_sec: 60

emergency:
  kill_switch_keyword: HALT_TRADING
  flatten_all_on_breaker: false     # breaker tetiklendiğinde mevcut açıkları KAPATMA (manuel onay)
  require_human_to_resume: true
