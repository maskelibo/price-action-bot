objective:
  timeframe: 15m
  market: binance_usdm_research_proxy
  direction: atomically_paired_long_short
  target_is_a_frozen_gate_not_an_optimizer: true
  target_monthly_return_pct: [10.0, 15.0]
  base_B_target_max_drawdown_pct: 15.0
  stressed_C2_H_tolerance_max_drawdown_pct: 20.0
  planning_expectation_note: >-
    Ten to fifteen percent per month is a stretch falsification gate, not a
    planning forecast. With low turnover, four fills per episode and low DD,
    even one to three percent net per month would be economically strong but
    does not pass this batch's return gate.

