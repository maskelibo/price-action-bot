signal_contract:
  spread: log_y_minus_alpha_minus_beta_log_x
  zscore: spread_minus_frozen_validation_mean_over_frozen_validation_std
  gross_weights:
    y: one_over_one_plus_beta
    x: beta_over_one_plus_beta
  entry_check: every_hour_when_minute_45_bar_completes
  persistence_bars_15m: 4
  persistence_rule: all_four_completed_closes_outside_same_entry_threshold
  high_spread_sides: {y: short, x: long}
  low_spread_sides: {y: long, x: short}
  decision: completed_15m_bar_close
  decision_ts_storage: source_bar_open_label_with_minute_45
  actual_decision_instant: decision_ts_plus_15_minutes
  earliest_entry: next_contiguous_15m_bar_open
  atomic_entry_ts: decision_ts_plus_15_minutes_for_both_legs
  atomic_entry: true
  reject_if_either_leg_missing: true
  one_active_episode_per_pair: true
  one_active_pair_per_symbol: true
  reject_entry_when_abs_z_gte_disaster_abs_z: true

economic_entry_gate:
  expected_convergence_return_formula: (abs_z_minus_exit_abs_z)*validation_std/(1+beta)
  adverse_funding:
    lookback_events_per_leg: 3
    funding_credits_count_as_zero: true
    per_event_cost: weighted_worst_known_payment_rate_for_proposed_leg_side
    cadence_lookback_events: 30
    event_timestamp_normalization: floor_fractional_seconds_to_whole_UTC_second
    horizon_events: >-
      ceil(max_hold_hours/min_positive_interval_hours_in_last_30_strictly_known
      normalized_events); default interval is 8h when fewer than two exist
  base_round_trip_cost_per_gross_exposure: 0.0057
  C2_round_trip_cost_per_gross_exposure: 0.0114
  positive_H_payoff_multiplier: 0.50
  buffer_multiplier: 1.50
  entry_requirement: >-
    expected_convergence_return >= 1.5 * max(0.0114 + 2*adverse_funding,
    2 * (0.0057 + adverse_funding))
  funding_information_cutoff: event_ts_strictly_less_than_atomic_entry_ts
  atomic_fill_revalidation:
    fill_z: computed_from_both_entry_open_prices_and_frozen_model
    same_proposed_spread_direction_required: true
    abs_fill_z_gte_entry_abs_z: true
    abs_fill_z_lt_disaster_abs_z: true
    expected_convergence_and_economic_gate_recomputed_from_fill_z: true
    loss_per_gross_recomputed_from_fill_z: true
    any_failure: reject_both_legs

risk_and_execution:
  initial_equity: 10000.0
  risk_per_pair_episode_pct: 0.50
  dd_throttle: {threshold_pct: 6.0, risk_multiplier: 0.50}
  loss_per_gross_formula: >-
    (disaster_abs_z-abs_entry_z)*validation_std/(1+beta)
  gross_exposure_formula: risk_budget_divided_by_loss_per_gross
  leg_cap_behavior: scale_both_legs_and_gross_by_one_common_factor
  max_leg_notional_pct_equity: 15.0
  max_pairs: 3
  max_legs: 6
  max_leverage: 3.0
  leverage_definition: total_pair_gross_entry_notional_divided_by_current_NAV
  execution_costs_bps_per_leg:
    fee: 4.0
    spread_and_slippage: 20.0
    impact: 4.5
  base_single_leg_round_trip_bps: 57.0
  funding: observed_event_cashflow_per_remaining_leg_notional
  funding_event_mark_precedence:
    - finite_positive_event_mark_price
    - latest_symbol_15m_close_with_bar_open_plus_15m_lte_effective_event_ts
    - fail_closed_invalid_replay
  effective_funding_timestamp: raw_event_timestamp_floored_to_whole_UTC_second
  funding_position_eligibility: entry_ts_strictly_less_than_event_ts_lte_exit_ts
  funding_symbol_normalization: bare_BASE_to_BASE_slash_USDT
  funding_cashflow_formula: >-
    -side_direction_times_abs_quantity_times_mark_times_rate_times_funding_multiplier
  partial_exit: false
  pyramid: false
  single_leg_carry: false
  cost_scenarios:
    B: {cost_multiplier: 1.0, funding_multiplier: 1.0, positive_pnl_multiplier: 1.0, negative_pnl_multiplier: 1.0}
    C2: {cost_multiplier: 2.0, funding_multiplier: 2.0, positive_pnl_multiplier: 1.0, negative_pnl_multiplier: 1.0}
    H: {cost_multiplier: 1.0, funding_multiplier: 1.0, positive_pnl_multiplier: 0.50, negative_pnl_multiplier: 1.25}

exit_contract:
  evaluate_on_every_completed_15m_bar: true
  execute_both_legs_at_next_contiguous_open: true
  mean_exit:
    high_entry: z_lte_positive_0_5
    low_entry: z_gte_negative_0_5
  structural_break:
    residual_mean_window_hours: 48
    distance_from_frozen_mean_sigma: 1.50
    consecutive_hourly_checks: 4
    quarantine_until_next_monthly_selection: true
  deselection_exit: true
  max_hold_from_atomic_entry: true
  priority:
    - data_gap
    - disaster_z_stop
    - structural_break
    - max_hold
    - pair_deselection
    - mean_exit
  ambiguous_execution: next_open_no_close_fill
  H_multiplier_applies_to_atomic_pair_price_pnl: true
  H_path_definition: >-
    At every 15m observation, cumulative atomic pair price PnL since entry is
    multiplied by 0.50 when positive or 1.25 when negative. The same rule is
    applied to final cumulative episode price PnL at exit. Execution costs and
    funding remain separate and are never haircut.
  scenario_path_dependence: >-
    Pair models and entry-intent stream are common, but NAV, DD throttle, size,
    caps and acceptance are replayed independently for B, C2 and H.
  cooldown_applies_after_every_episode_exit: true
  open_episode_keeps_entry_model_until_exit: true

selection_and_early_stop:
  batch_trial_count: 3
  rank_metric: H_trimmed_mean_monthly_return_capped_at_15pct
  tie_breakers:
    - lower_H_max_drawdown
    - fewer_H_negative_months
    - lower_H_pseudo_oos_filled_gross_turnover
    - lexicographic_candidate_id
  H_pseudo_oos_filled_gross_turnover:
    window: ["2023-06-01T00:00:00Z", "2026-06-01T00:00:00Z"]
    numerator: >-
      Sum both-leg gross entry fill notional for entries in the half-open
      window, both-leg gross exit fill notional for closed exits in the window,
      and accrued both-leg terminal liquidation notional at the final cutoff.
    denominator: arithmetic_mean_of_every_H_15m_NAV_observation_in_the_window
    unit: filled_gross_notional_per_average_NAV
    nonpositive_or_missing_denominator: fail_closed
  thresholds_may_not_be_relaxed_after_results: true
  ensemble_requires_new_preregistration: true
  primary_absolute_gates_before_holdout: true
  if_no_primary_cell_passes: RED_without_holdout_or_LOSO

validation_metrics:
  early_unavailable_formation_months: explicit_zero_return_not_dropped
  IS_denominator_nonpositive: fail_closed
  common_IS_ratio_window: ["2022-01-01T00:00:00Z", "2023-06-01T00:00:00Z"]
  full_24m_development_with_early_zero_months_is_also_reported: true
  trimmed_mean:
    symmetric_fraction_each_tail: 0.10
    cut_count: floor_n_times_fraction
  return_cap_15pct_applies_only_to_candidate_ranking: true
  candidate_rank_value: min_of_H_trimmed_mean_monthly_pct_and_15pct
  hard_gate_returns_are_uncapped: true
  block_bootstrap:
    method: overlapping_moving_blocks
    block_months: 3
    iterations: 20000
    seed: 17
    statistic: symmetric_10pct_trimmed_arithmetic_mean
    lower_quantile: 0.10
  holm_candidate_p:
    method: one_sided_zero_alpha_sign_flip_of_consecutive_3_month_blocks
    blocks: 12_nonoverlapping_chronological_blocks_of_exactly_3_months
    randomization: independently_multiply_each_whole_block_by_plus_or_minus_one
    pvalue: one_plus_count_null_stat_gte_observed_divided_by_iterations_plus_one
    iterations: 20000
    seed: 17
    scope: all_3_cells
  deflated_sharpe:
    returns: 36_month_H_percentage_point_returns
    n_trials: 3
    trial_distribution: all_3_periodic_monthly_sharpes
  pbo:
    method: CSCV
    matrix: exact_finite_36_by_3_H_monthly_return_matrix
    slices: 6
  effective_symbol_count:
    source: positive_marginal_PnL_from_true_leave_one_symbol_out_replays
    formula: one_over_sum_of_squared_positive_normalized_marginal_shares
  scenario_binding:
    sample_counts: H_closed_episodes_by_exit_timestamp
    H_return_stability_fold_concentration: H
    C2_return_direction_holdout: C2
    drawdown: B_and_worse_of_C2_H
    economic_edge: B
  active_month: at_least_one_15m_observation_with_nonzero_open_pair_exposure
  top_5pct_episode_removal:
    count: ceil_closed_or_terminal_episode_count_times_0_05_minimum_1
    method: additive_remove_highest_net_pair_PnL_no_rerun
  best_month_positive_pnl_share: best_positive_month_PnL_divided_by_sum_positive_month_PnL
  LOSO_marginal: full_H_total_net_PnL_minus_true_H_replay_without_symbol_total_net_PnL
  terminal_open_pairs:
    valuation: last_completed_close_MTM_net_of_accrued_liquidation_cost_with_funding
    included_in: [economic_edge, direction, episode_concentration, symbol_concentration]
    excluded_from_closed_sample_count: true

hard_gates:
  sample:
    pseudo_oos_months: 36
    minimum_closed_pair_episodes: 120
    minimum_high_spread_entries: 40
    minimum_low_spread_entries: 40
    minimum_active_months: 30
    pair_legs_may_not_count_as_separate_trades: true
  H_return:
    trimmed_mean_monthly_pct_min: 10.0
    median_monthly_pct_min: 8.0
    block_bootstrap_90pct_lower_bound_pct_min: 6.0
  H_stability:
    negative_months_max: 4
    months_below_minus_1pct_max: 3
    worst_month_pct_min: -6.0
  C2_return:
    trimmed_mean_monthly_pct_min: 8.0
    median_monthly_pct_min: 6.0
    total_return_must_be_positive: true
  drawdown:
    B_max_mtm_pct: 15.0
    C2_H_max_mtm_pct: 20.0
    max_recovery_months: 6
  walk_forward:
    positive_folds_min: 5
    total_folds: 6
    worst_six_month_fold_pct_min: -5.0
    oos_to_is_trimmed_return_ratio_min: 0.50
    oos_to_is_drawdown_ratio_max: 1.50
  economic_edge:
    B_closed_pair_price_pnl_before_execution_and_funding_must_be_positive: true
    B_pre_cost_price_pnl_over_execution_cost_min: 1.25
    median_entry_expected_edge_over_stressed_cost_min: 1.50
  concentration:
    best_month_positive_pnl_share_max: 0.15
    best_3_month_positive_pnl_share_max: 0.35
    top_5pct_pair_episodes_positive_pnl_share_max: 0.65
    net_after_top_5pct_pair_episodes_removed_must_be_positive: true
    effective_symbol_count_min: 6
    all_true_leave_one_symbol_out_replays_positive: true
  holdout:
    C2_total_return_must_be_positive: true
    primary_return_retention_min: 0.40
    retention_formula: >-
      holdout C2 trimmed monthly mean divided by primary C2 trimmed monthly mean
      over the same 36 pseudo-OOS months; nonpositive primary denominator fails
    distinct_holdout_symbols_traded_min: 4
    distinct_closed_holdout_pairs_min: 2
    minimum_closed_pair_episodes: 30
    minimum_active_months: 18
    max_drawdown_pct: 25.0
    evaluation_order: single_locked_primary_winner_then_LOSO_then_one_holdout_run
    runner_up_after_holdout_failure_forbidden: true
  direction:
    high_spread_C2_net_must_be_positive: true
    low_spread_C2_net_must_be_positive: true
  multiple_testing:
    paired_block_months: 3
    bootstrap_iterations: 20000
    holm_fwer_adjusted_p_max: 0.05
    deflated_sharpe_min: 0.95
    probability_backtest_overfit_max: 0.20
    local_v17_trial_count: 3
    cumulative_program_trial_count_including_v16: 9
    cumulative_program_holm_adjusted_p_max: 0.05
    cumulative_program_deflated_sharpe_min: 0.95
    cumulative_program_probability_backtest_overfit_max: 0.20

fair_baseline:
  required_before_better_than_v15p2_claim: true
  classification: FAIR_LIVE_POLICY_PROXY
  same_snapshot_cost_scenarios_and_half_open_periods: true
  missing_FnG_and_mark_L1_must_be_disclosed: true

provenance_required:
  - git_commit_and_research_file_hashes
  - prereg_sha256
  - both_snapshot_sha256_and_bytes
  - pair_selection_ledger_per_month
  - rejected_pair_reasons
  - atomic_episode_ledger
  - scenario_and_half_open_period
  - clean_source_preflight_and_unchanged_postflight
  - snapshot_size_and_sha256_postflight_match

execution_governance:
  execute_prereg_must_semantically_equal_canonical_repo_prereg: true
  source_clean_preflight_before_snapshot_access: true
  postflight_source_commit_and_file_hashes_must_match_preflight: true
  postflight_snapshot_size_and_sha256_must_match_preflight: true

research_proxy_limitations:
