      grimes_version: 1.0.0
      grimes_hash: 33653e0c52e34338
      mismatch_fails_closed: true
    exact_source_hashes_required_at_replay: true
  decision: completed_15m_signal_bar_close
  latest_feature_bar: decision_bar_itself_after_completion
  forming_bar_forbidden: true
  earliest_entry: next_exact_contiguous_15m_bar_open
  confidence_min: 0.25
  decision_reference_stop_distance_pct_min: 0.025
  decision_stop_distance_formula: abs_decision_close_minus_stop_divided_by_decision_close
  entry_stop_distance_is_used_only_after_eligibility_for_sizing_and_safety: true
  same_symbol_side_cooldown_days: 0.010
  same_symbol_side_cooldown_semantics: entry_to_next_entry
  same_symbol_side_cooldown_source_identity:
    scanner_run_15m_utility_enforces: true
    futures_daemon_v14_submit_path_enforces: false
    replay_retains_value: true
    exact_15m_grid_minimum_entry_spacing_minutes: 15
    configured_cooldown_minutes: 14.4
    behaviorally_inert_on_exact_contiguous_15m_entries: true
  duplicate_symbol_intents: first_accepted_intent_wins
  adapter_must_retain_all_signal_eligible_same_decision_intents: true
  risk_rejection_of_higher_priority_intent_allows_next_intent_to_be_evaluated: true
  deterministic_intent_order:
    keys: [decision_ts, symbol_lexicographic, strategy_priority, side_lexicographic]
    strategy_priority: [vsa_climax_test, grimes_abc_pullback]
  signal_results_must_be_regenerated_from_bars: true
  legacy_trade_pool_input_forbidden: true
  raw_signal_decision_evidence:
    every_strategy_emission_requires_one_ledger_row: true
    terminal_endpoint_without_next_bar_is_ledgered: true
    accepted_intents_reconcile_exactly_and_in_order_to_accepted_rows: true
    explicit_outcomes:
      - accepted
      - confidence_below_minimum
      - decision_stop_distance_below_minimum
      - missing_next_bar
      - duplicate_signal_fingerprint
  exact_rolling_last_500_equivalence:
    required_before_evidence_eligible_replay: true
    vsa_method: bounded_finite_dependency_exact_full_block_pass
    vsa_max_signal_dependency_is_strictly_below_500: true
    grimes_method: structural_candidate_superset_then_unmodified_exact_rolling_500
    grimes_engineered_superset_must_disable_cooldown_and_force_each_trend_direction: true
    candidate_endpoint_evaluation_uses_fresh_strategy_instance: true
    randomized_naive_every_endpoint_reference_required: true
    full_only_or_rolling_only_endpoint_signal_fails: true
    required_equal_fields:
