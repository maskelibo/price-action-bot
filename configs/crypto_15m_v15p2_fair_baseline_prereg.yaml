      frozen_FNG_history_available: false
      proxy_when_FNG_missing: allow
    inactive_strategy_filters: [F2_brooks_fb_bull, F4_engulfing_high_vol]

data_and_gap_contract:
  required_columns: [ts, open, high, low, close, volume]
  timestamps: UTC
  database_connection_timezone: UTC
  per_symbol_frames: true
  global_symbol_intersection_forbidden: true
  price_forward_fill_forbidden: true
  maximum_contiguous_gap_minutes: 30
  cross_gap_returns_and_features: invalid_until_the_strategy_warmup_is_rebuilt
  replay_history_load:
    evaluation_start_utc: "2021-06-01T00:00:00Z"
    load_history_start_utc: "2021-02-21T00:00:00Z"
    load_history_lead_calendar_days: 100
    history_is_features_only_before_evaluation_start: true
    entries_and_portfolio_PnL_before_evaluation_start_forbidden: true
    signal_requirement_at_evaluation_start: >-
      Each primary symbol must have at least 500 exact-contiguous completed 15m
      bars strictly before evaluation_start. The replay fails closed before
      producing evidence if any primary symbol cannot furnish them.
    signal_minimum_history_minutes: 7500
    signal_minimum_history_hours: 125
    correlation_requirement_at_evaluation_start: >-
      Each symbol needed by the causal pairwise correlation gate must have at
      least 91 completed UTC daily closes strictly before evaluation_start,
      yielding 90 finite daily log returns. The replay fails closed if the
      complete required matrix is unavailable.
    correlation_completed_daily_closes_min: 91
    correlation_daily_log_returns_min: 90
    correlation_at_later_decisions: >-
      Require the exact 90 UTC calendar dates ending one day before the entry
      date. Never reach farther back to substitute for a missing date. Use only
      completed UTC daily closes strictly observable at the decision; an intent
      whose pairwise matrix is incomplete is rejected fail-closed and ledgered.
    every_primary_must_reach_final_evaluation_bar: "2026-05-31T23:45:00Z"
    stale_marked_terminal_tail_from_early_symbol_end_forbidden: true
  post_gap_signal_rule: >-
    Every timestamp step other than exactly 15 minutes starts a new signal
    feature block. Never pass the strategy adapter bars across that boundary;
    discard pre-gap feature state and require 500 new exact 15m bars. The
    separate open-position data-gap exit retains its greater-than-30-minute
    threshold.
  open_position_at_gap: pessimistic_exit_at_first_tradable_open
  missing_entry_bar: reject_intent
  missing_month_return_pct: 0.0

