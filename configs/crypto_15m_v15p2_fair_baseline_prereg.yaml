  open_position_at_gap: pessimistic_exit_at_first_tradable_open
  missing_entry_bar: reject_intent
  missing_month_return_pct: 0.0

execution_proxy:
  classification: NEXT_OPEN_BAR_EXECUTION_PROXY
  initial_wallet_usdt: 10000.0
  continuous_fractional_quantity: true
  historical_tick_lot_and_min_notional_rounding: false
  entry_fill: next_exact_contiguous_bar_open
  signal_price_as_fill_forbidden: true
  stop_gap_fill: worse_of_bar_open_or_stop
  intrabar_collision_order: protective_stop_before_profit_targets
  target_fill_when_not_preempted: exact_target_level
  terminal_open_position: accrued_liquidation_at_period_end_mark_with_exit_cost
  post_only_order_queue_or_30s_fallback_simulated: false
  live_submission_latency_or_L1_book_simulated: false
  one_net_position_per_symbol: true
  pyramid: false

risk_and_portfolio_policy:
  risk_base: current_pre_entry_wallet_balance_after_realized_cashflows
  open_unrealized_PnL_is_not_in_live_wallet_sizing_base: true
  evaluation_NAV_is_separately_marked_to_market_every_15m: true
  fixed_starting_wallet_sizing_forbidden: true
  base_risk_per_trade_pct: 1.0
  current_wallet_recomputed_before_each_sequential_intent: true
  stop_distance_sizing: risk_budget_divided_by_absolute_entry_minus_initial_stop
  stop_distance_normalizer:
    enabled: true
    input_metric: entry_stop_distance_pct
    target_pct: 1.0
    factor_min: 0.20
    factor_max: 1.50
    formula: clamp_0p20_1p50_of_0p01_divided_by_stop_distance_pct
  drawdown_throttle:
    running_wallet_balance_peak: true
    threshold_pct: 6.0
    new_entry_risk_multiplier: 0.50
  max_notional_per_symbol_pct_current_wallet: 15.0
  max_open_positions: 16
  effective_max_open_positions_under_primary13: 13
  max_same_side_open_positions: 4
  max_portfolio_notional_x_current_wallet: 3.0
  leverage_for_margin_proxy: 3.0
  free_margin_must_remain_nonnegative: true
  initial_margin_gate:
    required_initial_margin_formula: accepted_notional_divided_by_leverage_used
    margin_safety_buffer_ratio: 0.90
    accept_only_if: required_initial_margin_lte_free_margin_times_0p90
    wrapper_repeats_same_0p90_gate: true
  stop_liquidation_margin_safety_gate:
    margin_safety_ratio: 0.50
    approximate_liquidation_distance_pct_formula: one_divided_by_leverage_used
    accept_only_if: stop_distance_pct_lte_one_divided_by_leverage_times_0p50
  correlation_gate:
    enabled: true
    causal_daily_log_return_lookback_days: 90
    max_pairwise_correlation: 0.70
    risk_reduction_factor: 0.50
    hard_block_at: 0.90
  category_concentration_gate:
    enabled: false
    reason: live_category_map_is_not_supplied_and_the_YAML_value_is_inert
  breakers:
    daily:
      loss_pct: 4.0
      pnl_basis: realized_partial_and_final_exit_net_PnL_excluding_separately_booked_funding
      anchor: wallet_balance_at_UTC_day_start
      halt_days: 1
    weekly:
      loss_pct: 8.0
      pnl_basis: current_wallet_balance_minus_Monday_00_00_UTC_anchor
      halt_days: 2
    monthly_combined:
      loss_pct: 99.0
      pnl_basis: current_wallet_balance_minus_month_start_anchor
      halt_days: 3
    monthly_long:
      loss_pct: 12.0
      pnl_basis: realized_long_partial_and_final_exit_net_PnL_excluding_separately_booked_funding
      denominator: month_start_wallet_balance
      halt_days: 3
      blocked_side_only: true
    monthly_short:
      loss_pct: 4.0
      pnl_basis: realized_short_partial_and_final_exit_net_PnL_excluding_separately_booked_funding
      denominator: month_start_wallet_balance
      halt_days: 3
      blocked_side_only: true
    consecutive_losses:
      count: 5
      pause_days: 1.0
      a_trade_is_loss_when_journal_final_episode_net_pnl_is_below_zero: true
    active_breaker_blocks_new_entries_only: true
    existing_positions_are_not_force_flattened: true
    reset_clock: UTC

exit_policy:
  authority: scripts/futures_daemon_v14.py_wrapper_override
  initial_stop: signal_generated_stop
  TP1:
    trigger_R: 1.0
    fraction_of_original_quantity: 0.30
  TP2:
    trigger_R: 1.5
    fraction_of_original_quantity: 0.30
  runner:
    fraction_of_original_quantity: 0.40
    break_even_lock_after_TP1: true
    trail_method: percentage_of_favorable_peak_proxy
    trail_pct: 0.015
    trail_activates_after_R: 1.0
    trail_ratchet_uses_completed_bar_favorable_extreme: true
    ratchet_becomes_effective_on_next_bar: true
    time_stop_bars_after_first_TP1_fill: 30
    time_stop_clock_bar_minutes: 15
    time_stop_fill_proxy: next_contiguous_bar_open
  multiple_targets_touched_without_stop:
    order: [TP1, TP2]
    both_may_fill_on_the_same_bar: true
  remaining_quantity_at_final_cutoff: accrued_liquidation_only_not_a_closed_episode
  explicitly_inert_or_excluded_config:
    path: configs/risk_phoenix_scalp_15m_v15p2.yaml.exit_engine
    dead_values: TP1_25pct_TP2_25pct_runner_50pct
    reason: >-
      No runtime consumer reads this YAML block. The fair proxy follows the
      startup-verified wrapper's canonical 30/30/40 protection policy.
  ATR_chandelier_1p5x_is_not_the_live_exit: true

external_live_gate_proxy_policy:
  FNG_history_in_frozen_snapshots: false
  historical_mark_L1_and_queue_state_in_frozen_snapshots: false
  FNG_dependent_filters_when_value_is_missing: no_rejection_fail_open_proxy
  post_only_maker_fill_assumption: not_used
  exchange_state_stale_and_API_rate_limit_rejections: not_simulated
  historical_exchange_rounding_and_margin_tiers: not_simulated
  limitation_disclosure_required_in_every_result: true
  bias_direction_known: false
  wrapper_header_fixed_starting_equity_comment_is_not_runtime_sizing_authority: true

cost_and_payoff_scenarios:
  bps_per_actual_fill:
    fee: 4.0
    spread_and_slippage: 20.0
    impact: 4.5
  base_cost_bps_per_actual_fill: 28.5
  base_one_entry_plus_full_quantity_exit_round_trip_bps: 57.0
  partial_exit_cost_rule: >-
    Charge each TP1, TP2, runner, stop, gap, time-stop, and terminal liquidation
    fill on its actually filled notional. Entry is charged once on entry notional.
  funding: observed_event_cashflow_on_remaining_open_notional
  funding_mark_fallback: event_mark_when_finite_positive_else_latest_causal_close
  cost_scenarios:
    B:
      cost_multiplier: 1.0
      funding_multiplier: 1.0
      positive_price_pnl_multiplier: 1.0
      negative_price_pnl_multiplier: 1.0
    C2:
      cost_multiplier: 2.0
      funding_multiplier: 2.0
      positive_price_pnl_multiplier: 1.0
      negative_price_pnl_multiplier: 1.0
    H:
      cost_multiplier: 1.0
      funding_multiplier: 1.0
      positive_price_pnl_multiplier: 0.50
      negative_price_pnl_multiplier: 1.25
  H_payoff_multiplier_granularity: each_realized_partial_or_terminal_price_pnl_slice
  execution_cost_and_funding_are_not_payoff_haircut_again: true
  all_three_scenarios_require_independent_path_dependent_replay: true

evidence_contract:
  curve:
    required_for_scenarios: [B, C2, H]
    observation: every_available_15m_bar_after_all_bar_events
    timestamp_semantics: post_close_NAV_with_source_bar_open_label
    includes_open_position_MTM: true
    includes_accrued_exit_cost_for_open_positions: true
    monthly_baseline: last_NAV_strictly_before_month_start
    monthly_return_unit: percentage_points
    month_or_fold_reset_forbidden: true
  ledgers_required:
    - every_signal_and_rejection_reason
    - decision_and_scheduled_entry_timestamps
    - every_entry_fill
    - every_partial_and_final_exit_fill
    - initial_and_ratcheted_stop_state
    - funding_cashflow_by_event
    - execution_cost_component_by_fill
    - breaker_state_transitions
    - current_wallet_risk_budget_and_cap_binding
    - terminal_open_position_accrual
  pseudo_oos_H_months_must_equal: 36
  fold_months_must_equal: [6, 6, 6, 6, 6, 6]
  required_metrics:
    - B_C2_H_monthly_returns_and_PnL
    - H_10pct_symmetric_trimmed_mean_monthly_return
    - H_median_mean_negative_month_count_months_below_minus_1_and_worst_month
    - B_C2_H_full_15m_MTM_max_drawdown_and_recovery
    - six_nonoverlapping_H_fold_returns
    - H_development_to_pseudo_OOS_return_and_drawdown_ratios
    - long_short_strategy_symbol_and_month_concentration
    - closed_episode_and_partial_fill_counts
    - filled_gross_turnover_over_arithmetic_mean_15m_NAV
  strict_JSON_finite_or_null: true

fair_improvement_rules_frozen_from_v16:
  comparison_scenario: H
  same_snapshot_universe_period_execution_costs_and_metric_code_required: true
  absolute_challenger_hard_gates_still_required: true
  pass_logic: rule_1_or_rule_2_and_stability_noninferiority
  rule_1:
    challenger_H_trimmed_mean_monthly_return_pct_min_formula: max_10pct_or_baseline_plus_1p5pp
    challenger_H_max_MTM_drawdown_may_be_at_most_pp_worse: 1.0
  rule_2:
    challenger_H_trimmed_mean_monthly_return_must_be_within_pp_of_baseline: 1.0
    challenger_H_max_MTM_drawdown_reduction_vs_baseline_min_fraction: 0.25
  stability_noninferiority:
    challenger_H_negative_month_count_may_not_be_worse: true
    challenger_H_worst_month_may_not_be_worse: true
  exact_legacy_rule_labels:
    better_rule_1: H_trimmed_return_at_least_max_10pct_or_v15p2_plus_1p5pp_and_DD_no_more_than_1pp_worse
    better_rule_2: H_return_within_1pp_of_v15p2_and_DD_at_least_25pct_lower
    negative_months_and_worst_month_may_not_be_worse: true
  old_21p36_headline_may_not_substitute_for_this_baseline: true

