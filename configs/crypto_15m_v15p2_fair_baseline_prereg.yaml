pre_result_amendments:
  - at_utc: "2026-07-11T08:23:43Z"
    subject: scanner_window_gap_warmup_and_correlation_history_binding
    change: >-
      Before any snapshot replay, the live scanner's rolling last-500-bar input
      was made explicit. Each initial or post-gap signal evaluation requires an
      exact-contiguous 500-bar window, and full-prefix versus rolling-last-500
      signal parity is mandatory evidence. The history runner must start 100
      calendar days before evaluation so it can also furnish 91 completed UTC
      daily closes (90 causal log returns) for the correlation gate. Missing
      initial signal or correlation history fails closed. No strategy, risk,
      exit, cost, comparison rule, or result threshold changed.
  - at_utc: "2026-07-11T11:05:00Z"
    subject: adversarial_live_parity_repairs_before_snapshot_access
    change: >-
      Before any snapshot database was opened, independent signal and engine
      audits found result-changing parity gaps. The on-disk scanner was repaired
      to filter completed bars before taking the exact rolling 500; the running
      daemon was not restarted and therefore still has the old imported image.
      WIDESTOP selection was bound to decision close, duplicate intents were
      retained until risk acceptance, rolling strategy equivalence was made
      exact, dynamic leverage and gate ordering were bound to RiskOfficer, and
      journal/breaker timing plus evaluation boundaries were made explicit.
      The static $10 RiskOfficer minimum notional was also declared separately
      from excluded historical exchange rounding. No snapshot replay, holdout
      access, strategy selection, result threshold change, or deployment occurred.
  - at_utc: "2026-07-11T11:31:55Z"
    subject: evidence_lifecycle_and_source_repairs_before_snapshot_access
    change: >-
      Before any snapshot database was opened, the evidence contract was made
      fail-closed for every raw signal outcome, exact trailing 90 UTC calendar
      returns, every primary symbol's final evaluation bar, one shared
      daily-first combined breaker clock, the deployed one-shot side halt, and
      post-settlement midnight anchors. The on-disk daily realized-PnL adapter
      was repaired so a partial-only journal day cannot fall through to wallet
      delta. classic_pa and contracts were added to executable provenance. The
      running daemon was not restarted, no snapshot or holdout was accessed,
      and no strategy, threshold, comparison rule, or result was selected.
  - at_utc: "2026-07-11T12:11:37Z"
    subject: final_integrated_contract_repairs_before_snapshot_access
    change: >-
      A final runner-to-report and live-source review found additional
      result-path differences before any snapshot access. The live correlation
      matrix/gate now requires exact trailing UTC calendar returns and fails
      closed on missing, malformed, stale, or undefined pairs. Exact-zero final
      PnL breaks the live consecutive-loss streak and its 30-day journal
      lookback is explicit in replay. A next-open stop on the nonprotective side
      is rejected by both repaired RiskOfficer and replay, while DD peak
      observation occurs only when an intent reaches the live throttle stage.
      Runner/reporter signal fingerprints, six-field classification, complete
      Markdown limitations, and atomic report publication were also reconciled.
      The running daemon was not restarted, no snapshot or holdout was accessed,
      and no strategy, threshold, comparison rule, or result was selected.
  - at_utc: "2026-07-11T12:21:22Z"
    subject: final_governance_and_loss_counter_repairs_before_snapshot_access
    change: >-
      Before snapshot access, the live consecutive-loss query's arbitrary
      20-row default cap was removed so its full 30-day window matches replay
      and consumed-watermark re-triggering. The prereg loader now rejects
      duplicate YAML keys at any depth; the lab package import is side-effect
      free so module CLI stdout remains one strict JSON document without log
      mutation; executed package/logging/settings sources and relevant tests
      are included in provenance. The reporter is bound to the exact frozen
      snapshot and preregistration identities. No daemon restart, snapshot or
      holdout access, policy/result selection, or deployment occurred.
  - at_utc: "2026-07-11T12:36:13Z"
    subject: final_report_contract_and_mechanical_source_lock_before_snapshot_access
    change: >-
      Before snapshot access, the reporter was made fail-closed on exact
      preflight/postflight source, runtime, preregistration, and snapshot
      identity; accepted-intent reconciliation and the complete signal hash
      chain are mandatory. Ruff then normalized four adjacent SQL string
      literals in the already repaired scanner without changing behavior, and
      its audited source hash was refreshed before the final source freeze. No
      daemon restart, snapshot or holdout access, policy/result selection, or
      deployment occurred.

