# Token budget — per-agent günlük input+output token limit (Faz 4.2).
#
# Max Pro plan altında bu rakamlar **referans** amaçlı; gerçek faturalama
# Anthropic dashboard'unda. Limit aşımı OpsAgent CRIT alarm tetikler
# (`token_budget.check_budget()`).
#
# Notlar:
# - Sonnet/Haiku ucuz; Opus pahalı — limit Opus ağırlıklı tutulur
# - Deterministic agent'lar (portfolio_manager, signal_chief, execution_chief)
#   LLM kullanmaz, limit 0
# - Faz 5+ kalibrasyon: ilk 2 hafta gözlemden sonra revize edilir

daily_limits:
  # REVIZE 2026-05-27 (Faz 14.12): 24h üretim verisi gözlemlendi:
  #   researcher    1.8M / 1.5M (120%) → 3M    (5-batch + drift + pulse spike)
  #   analyst       709k / 250k (284%) → 1.5M  (whatif + daily_kpi + per-bot)
  #   lab_scientist 526k / 400k (132%) → 1.5M  (daily tournament + sweep + drift)
  #   risk_officer  436k / 250k (174%) → 1M    (tournament + lifecycle review)
  #   ceo           802k / 1M   ( 80%) → 2M    (brief + arbitrate + weekly + spike)
  # Politika: ~2-3x gözlemlenmiş peak. Max Pro daily quota'sı bunlardan çok
  # yukarıda, gerçek $ ödeme yok — bu limitler sadece "agent kontrolden çıkmış mı"
  # kanaryası (örn sonsuz döngü). 5h pencere rate limit'i ayrı, Anthropic backend.

  # REVIZE 2026-05-27 09:37 TR (Faz 14.19): Hipotez backtest runner +
  # daily tournament + 30dk cron sonrası tekrar aşımlar:
  #   researcher    3.46M / 3M  (115%) → 6M  (Faz 14.15 hyp backtest LLM extract spike)
  #   lab_scientist 4.14M / 1.5M (276%) → 8M  (tournament + sweep cell + 50 extract)
  #   risk_officer  2.10M / 1M  (210%) → 4M  (tournament + critique + endorse zinciri)
  # Diğerleri stabil, dokunmuyorum. Max Pro içinde, gerçek $ yok.

  # En kritik düşünme (Opus 4.7 kalıyor)
  ceo: 3000000            # 2M → 3M (2026-05-30: 24h %94 (1.88M); inbox backlog
                          # işleme + brief/arbitrate/weekly spike. Runaway değil.)
  researcher: 25000000    # 12M → 25M (2026-05-30: 24h gerçek peak 13.9M legit
                          # = 5-batch + pulse + hyp-backtest LLM-extract spike +
                          # gündüz manuel ağır araştırma. 12M CRIT yanlış-pozitifti
                          # (Max Pro, gerçek $ yok → kanarya SADECE runaway için).
                          # 25M = legit peak'in ~1.8x; gerçek infinite-loop runaway
                          # (sürekli 1M+/saat) hâlâ tetikler.
  adversary_engineer: 500000  # 500k stabil

  # Sonnet'e geçenler
  lab_scientist: 8000000  # 1.5M → 8M (tournament + 50+ hipotez extract + sweep)
  analyst: 1500000        # 1.5M stabil
  market_scout: 300000    # 300k stabil
  strategy_curator: 400000 # 400k stabil

  # Reviewer/operasyon
  risk_officer: 4000000   # 1M → 4M (tournament zinciri büyüdü)
  ops_engineer: 200000    # 200k stabil
  data_engineer: 60000    # 60k stabil

  # Faz 6 — Bot Monitor (Haiku)
  bot_monitor: 400000     # 400k stabil

  # Deterministic — LLM use yok
  portfolio_manager: 0
  signal_chief: 0
  execution_chief: 0

# Haftalık tüm-agent toplam limiti
# Yeni dailies × 7 (Faz 14.19):
#   2 + 6 + 0.5 + 8 + 1.5 + 0.3 + 0.4 + 4 + 0.2 + 0.06 + 0.4 = 23.36M × 7 ≈ 164M
weekly_limit_total: 350000000  # 250M → 350M (2026-05-30: researcher 12M→25M ile
                               # dailies toplamı ~42M/gün × 7 ≈ 296M; 350M headroom)

# Alarm seviyeleri (sıkı tut, erken uyarı)
alert_threshold_pct: 75
crit_threshold_pct: 95

# Notlar:
# - Max Pro paketi içinde bu rakamlar referans (gerçek fatura Anthropic dashboard)
# - Sonnet 4.6 = $3/$15 (input/output per 1M), Opus 4.7 = $5/$25 — Sonnet 5x ucuz
# - Haiku 4.5 = $1/$5 — en ucuz, bot_monitor için ideal
# - Limit aşımı → push_critical CRIT alarm + 24 saat içinde revize

