# Token budget — per-agent günlük input+output token limit (Faz 4.2).
#
# Max Pro plan altında bu rakamlar **referans** amaçlı; gerçek faturalama
# Anthropic dashboard'unda. Limit aşımı OpsAgent CRIT alarm tetikler
# (`token_budget.check_budget()`).
#
# Notlar:
# - Sonnet/Haiku ucuz; Opus pahalı — limit Opus ağırlıklı tutulur
# - Deterministic agent'lar (portfolio_manager, signal_chief, execution_chief)
#   LLM kullanmaz, limit 0
# - Faz 5+ kalibrasyon: ilk 2 hafta gözlemden sonra revize edilir

daily_limits:
  # REVIZE 2026-05-25: Risk Officer üretimde 60K limit aşmış (98K/60K = %164).
  # Sebep: review_doc full body okuyor, lifecycle/feasibility raporları 30K+ token.
  # Politika değişikliği: limitleri 3x buffer ile artır + Sonnet'e geçen agent'lara
  # daha fazla pay (5x ucuz olduğu için aynı dolar maliyette 5x token alır).

  # En kritik düşünme (Opus 4.7 kalıyor)
  ceo: 1000000            # 80k → 250k → 1M (Faz 13: brief + arbitrate + weekly + monthly + spike buffer)
  researcher: 1500000     # 500k → 1.5M (Faz 13: gün içi 5 pulse + 5-batch + drift response + spike buffer)
  adversary_engineer: 250000  # 80k → 250k (stress test büyük doc)

  # Sonnet'e geçenler (Faz 13 planı, daha fazla token tolere)
  lab_scientist: 400000   # 150k → 400k (param sweep × 3 frekans + TF)
  analyst: 250000         # 80k → 250k (per-bot card + whatif daily)
  market_scout: 150000    # 40k → 150k (aylık burst yüksek ama günlük 0)
  strategy_curator: 200000 # 60k → 200k (haftalık review + 4-saatte 1 corr)

  # Reviewer/operasyon (üretimde gözlenen)
  risk_officer: 250000    # 60k → 250k (98K kullanım kanıtladı — 4x buffer)
  ops_engineer: 100000    # 30k → 100k (Haiku ucuz, sık çalışsın)
  data_engineer: 30000    # 10k → 30k

  # Faz 6 — Bot Monitor (Haiku, 15dk frekans → 4x daha sık)
  bot_monitor: 200000     # 50k → 200k (Haiku 5x ucuz, sıklık 4x → net 5x bütçe)

  # Deterministic — LLM use yok
  portfolio_manager: 0
  signal_chief: 0
  execution_chief: 0

# Haftalık tüm-agent toplam limiti
# Sum of dailies × 7 ≈ 19M, biraz buffer ile:
weekly_limit_total: 35000000  # 8M → 25M → 35M (Researcher 1.5M/gün'e çıktı)

# Alarm seviyeleri (sıkı tut, erken uyarı)
alert_threshold_pct: 75
crit_threshold_pct: 95

# Notlar:
# - Max Pro paketi içinde bu rakamlar referans (gerçek fatura Anthropic dashboard)
# - Sonnet 4.6 = $3/$15 (input/output per 1M), Opus 4.7 = $5/$25 — Sonnet 5x ucuz
# - Haiku 4.5 = $1/$5 — en ucuz, bot_monitor için ideal
# - Limit aşımı → push_critical CRIT alarm + 24 saat içinde revize

