      sha256: 9f0eae0bb08f45ceacdb7a3bb9c48ceb1b2f1b3469d21bd2bf572e11ecf6a95b
      functions:
        - candidate_block_sign_flip_test
        - program_wide_multiple_testing
  locked_statistical_algorithms:
    missing_or_nonfinite_input: fail_closed_UNVERIFIABLE
    symmetric_trimmed_mean:
      order: stable_numeric_ascending
      cut_each_tail: floor_n_times_0_10
      statistic: arithmetic_mean_of_remaining_values
    moving_block_bootstrap:
      blocks: all_34_overlapping_consecutive_3_month_blocks_from_36_months
      generator: numpy_random_default_rng_PCG64_seed_18
      draws_per_iteration: 12_block_indices_uniform_with_replacement
      assembly: concatenate_drawn_blocks_then_take_first_36_values
      iterations: 20000
      statistic: symmetric_10pct_trimmed_arithmetic_mean
      lower_quantile: 0.10
      quantile_method: numpy_quantile_linear
    sign_flip:
      blocks: 12_nonoverlapping_consecutive_3_month_blocks
      generator: numpy_random_default_rng_PCG64_seed_18
      sign_draw: integers_0_or_1_mapped_to_minus_1_or_plus_1_independently_per_block
      iterations: 20000
      observed_statistic: symmetric_10pct_trimmed_arithmetic_mean_of_36_months
      null_statistic: same_statistic_after_block_signs
      exceedance: null_statistic_greater_than_or_equal_to_observed
      pvalue: one_plus_exceedances_divided_by_20001
    holm:
      family_order: canonical_candidate_order_restricted_to_family
      sort: ascending_raw_p_stable_ties_preserve_family_order
      adjusted_formula: >-
        cumulative_max_over_sorted_rank_j_of_family_size_minus_j_times_raw_p,
        clipped_to_1_and_returned_in_family_order
    periodic_sharpe:
      formula: arithmetic_mean_divided_by_sample_standard_deviation_ddof_1
      annualization_for_display_only: multiply_by_sqrt_12
      zero_standard_deviation: positive_inf_negative_inf_or_zero_by_mean
    deflated_sharpe:
      implementation: bound_shared_statistics.deflated_sharpe_statistics
      observed_returns: exact_36_H_monthly_percentage_point_returns
      trial_distribution: exact_13_periodic_monthly_sharpes_in_canonical_candidate_order
      n_trials: 13
      periods_per_year: 12
      skew_and_kurtosis: population_standardized_central_moments
      sharpe_standard_error_ddof: n_minus_1_denominator_as_bound_source
      expected_max: euler_mascheroni_normal_order_statistic_as_bound_source
      output: standard_normal_CDF_of_observed_minus_expected_max_over_standard_error
      any_nonfinite_trial_sharpe: fail_closed_UNVERIFIABLE
    cscv_pbo:
      scope: local_exact_36_by_4_H_matrix_only
      candidate_column_order: [C1_VSA_ONLY, C2_GRIMES_ONLY, C3_DUAL_HTF50, C4_VSA_HTF50]
      slices: numpy_array_split_36_chronological_rows_into_6_equal_slices
      combinations: lexicographic_all_choose_3_of_6
      score: periodic_sharpe_mean_over_sample_std_ddof_1
      in_sample_selection: numpy_argmax_first_column_wins_exact_tie
      out_sample_rank: pandas_average_rank_ascending
      relative_rank: rank_divided_by_5
      logit: natural_log_relative_rank_divided_by_one_minus_relative_rank
      probability: fraction_of_20_logits_less_than_or_equal_to_zero
  local_H_matrix: exact_finite_36_by_4_percentage_point_monthly_returns
  local_holm:
    raw_p_method: locked_statistical_algorithms.sign_flip
    iterations: 20000
    seed: 18
    scope: all_4_v18_cells
  cumulative_floor_holm:
    scope: >-
      recompute all exact reconstructible 9 prior plus 4 V18 raw pvalues under
      locked_statistical_algorithms.sign_flip and apply one 13-member Holm family
    adjusted_p_max: 0.05
    missing_prior_input: fail_closed_UNVERIFIABLE
  deflated_sharpe:
    returns: 36_month_H_percentage_point_returns
    n_trials_floor: 13
    minimum: 0.95
    trial_distribution: exact_13_periodic_monthly_sharpes_in_canonical_candidate_order
    missing_prior_trial_distribution: fail_closed_UNVERIFIABLE
  probability_backtest_overfit:
    method: locked_statistical_algorithms.cscv_pbo
    matrix: exact_finite_36_by_4_H_monthly_return_matrix
    slices: 6
    maximum: 0.20
  limitation: >-
    Passing the governed floor of thirteen does not erase the larger
    unreconstructible legacy search. Historical evidence remains feasibility
    only and cannot authorize promotion without prospective proof.

selection_and_early_stop:
  thresholds_may_not_be_relaxed_after_results: true
  no_primary_cell_passes: RED_without_LOSO
  deterministic_rank_among_absolute_gate_passers:
    primary: H_trimmed_mean_monthly_return_capped_at_15pct
    tie_breakers:
      - lower_H_max_MTM_drawdown
      - fewer_H_negative_months
      - better_H_worst_month
      - lower_H_filled_gross_turnover
      - lexicographic_candidate_id
  only_locked_winner_runs_true_LOSO: true
  runner_up_after_winner_LOSO_failure_forbidden: true
  ensemble_or_new_threshold_requires_new_preregistration: true

fair_baseline_comparison:
  canonical_contract: frozen_lineage.fair_baseline_v2_contract
  canonical_program_source: frozen_lineage.fair_baseline_v2_program_source
  canonical_report_source: frozen_lineage.fair_baseline_v2_report_source
  canonical_outputs:
    raw_json: reports/research/crypto_15m_v15p2_fair_baseline_v2_raw.json
    report_json: reports/research/crypto_15m_v15p2_fair_baseline_v2_report.json
    report_markdown: reports/research/CRYPTO_15M_V15P2_FAIR_BASELINE_V2.md
    post_run_identity: configs/crypto_15m_v15p2_fair_baseline_v2_result_identity.json
  result_identity_requirements:
    raw_schema_version: crypto-15m-v15p2-fair-baseline-run-v2
    report_schema_version: crypto-15m-v15p2-fair-baseline-report-v2
    prereg_path_bytes_sha_must_match_canonical_contract: true
    program_and_report_source_bytes_sha_must_match_frozen_lineage: true
    market_and_funding_bytes_sha_must_match_snapshots: true
    raw_and_report_artifact_path_bytes_sha_required: true
    execution_git_commit_required: true
    clean_source_preflight_and_unchanged_postflight_required: true
    raw_and_report_evidence_eligible_must_both_be_true: true
    post_run_identity_must_bind_all_of_the_above_before_comparison: true
    missing_mismatch_or_duplicate_canonical_output: no_better_than_baseline_claim
  baseline_must_be_run_on_exact_same_V3_market_and_funding_snapshots: true
  same_universe_period_execution_costs_policy_and_metric_code_required: true
  old_21p36_pool_headline_forbidden: true
  absolute_challenger_hard_gates_still_required: true
  pass_logic: rule_1_or_rule_2_and_stability_noninferiority
  rule_1:
    challenger_H_trimmed_mean_monthly_pct_min_formula: max_10pct_or_baseline_plus_1p5pp
    challenger_H_max_MTM_drawdown_may_be_at_most_pp_worse: 1.0
  rule_2:
    challenger_H_trimmed_mean_monthly_return_must_be_within_pp_of_baseline: 1.0
    challenger_H_max_MTM_drawdown_reduction_vs_baseline_min_fraction: 0.25
  stability_noninferiority:
    H_negative_month_count_may_not_be_worse_than_baseline: true
    H_worst_month_may_not_be_worse_than_baseline: true
  missing_or_ineligible_baseline_result: no_better_than_baseline_claim

prospective_evidence_gate:
  required_after_historical_winner: true
  starts_only_after_candidate_source_and_policy_are_frozen: true
  minimum_calendar_days: 90
  minimum_closed_trades: 100
  stop_when: both_minimums_satisfied_whichever_occurs_later
  median_realized_all_in_cost_must_not_exceed_historical_C2_modeled_median: true
  integrity_failures_allowed: 0
  net_return_must_be_positive: true
  max_MTM_drawdown_pct: 10.0
  matched_signal_intent_fill_and_exit_reconciliation_required: true
  paper_or_shadow_only_until_gate_passes: true
  automatic_live_deployment_forbidden: true
  explicit_human_risk_and_deployment_decision_required_after_pass: true

implementation_and_execution_governance:
  current_artifact_is_design_only: true
  engine_program_or_report_implemented_by_this_change: false
  implementation_must_be_completed_and_tested_before_any_snapshot_performance_open: true
  implementation_must_reject_any_prereg_drift: true
  canonical_prereg_path: configs/crypto_15m_v18_challenger_prereg.yaml
  clean_source_preflight_before_snapshot_access: true
  prereg_source_runtime_and_snapshot_hashes_required_preflight_and_postflight: true
  result_must_include_all_cell_month_trade_fill_rejection_and_LOSO_ledgers: true
  no_account_credentials_exchange_orders_daemon_restart_or_live_state_mutation: true
  governance_failure_result: INELIGIBLE_EVIDENCE

limitations:
