# ============================================================================
# 🔥 PHOENIX — v2.0.4 WYCKOFF FIX BOT
# ============================================================================
# Bot adı: PHOENIX (wyckoff fantasy alpha temizlendi, yükselen)
# Versiyon: v2.0.4
# Profil: Wyckoff_phase_d DISABLED (12/13 strateji aktif) - WYK-001 mitigation
# 2026-05-15 bizim test: yillik +%200.3 / DD -%32.0 / r-adj 6.26 / WR %69.7
# 13/13 pencere POZITIF, min +%93.4, max +%315.8
# Status: PAPER TRADE adayı — ATLAS ile paralel A/B test
#
# Atlas'tan TEK fark: strategies listesinde wyckoff_phase_d YOK
# Atlas referansına +%66pp uplift / -%10.4pp DD tıraş (empirik 13-pencere)
#
# Gerekçe: wyckoff_phase_d.py _detect_spring + _detect_utad future bar close
# kullanıyor (lookahead leak, Signal Chief audit 2026-05-15 HARD FAIL).
# Empirik ek bulgu: disable etmek ROI'yi +%66pp ARTIRIYOR (fantasy alpha
# değil, NET DD ağırlığı taşıyordu).
# ============================================================================

defaults:
  account_currency: USDT
  preset_name: phoenix_v204
  bot_name: PHOENIX

position_sizing:
  method: confidence_dynamic       # v0.7 — confidence tier bazli dynamic
  risk_per_trade: 0.04             # AGGRESSIVE: %3 -> %4 (yuksek conf'da live)
  # v0.9.3 AGGRESSIVE: backtest_risk_pct %4 (production %3'ten +1pp)
  # 3y rolling 13 pencere sweep: yillik +%42.4 (production +%34.7), DD -%37 (-%39)
  backtest_risk_pct: 0.040
  confidence_risk_tiers:           # v0.7 production: 1-4% dynamic
    - {min: 0.00, max: 0.32, risk_pct: 0.010}  # %1 — defensive
    - {min: 0.32, max: 0.42, risk_pct: 0.015}  # %1.5
    - {min: 0.42, max: 0.52, risk_pct: 0.020}  # %2 — default
    - {min: 0.52, max: 0.58, risk_pct: 0.030}  # %3
    - {min: 0.58, max: 1.01, risk_pct: 0.040}  # %4 — yuksek conf, bas
  kelly_cap: 0.25
  min_quantity_usdt: 20
  size_rounding: exchange_step
  # v0.9.2: Notional cap per equity — gunis SL trade'lerin asiri buyuk pozisyon yapmasini engeller.
  # Effect: tight SL = ayni notional, wide SL = capped notional (otomatik vol normalize).
  # 5y backtest: yillik %64 -> %97 (+33pp), DD -%75 -> -%59 (+16pp). Bkz: v0.9.2 memo.
  max_notional_pct_equity: 0.30

stop_loss:
  method: atr                       # atr | structural | hybrid
  atr_period: 14
  atr_multiplier: 2.0
  structural_buffer_pct: 0.005      # swing low altına %0.5 tampon
  trailing:
    enabled: true
    method: atr_chandelier
    atr_period: 14
    multiplier: 3.0
    activate_after_R: 1.0           # 1R kâra geldikten sonra trailing açık

take_profit:
  method: r_multiple                # r_multiple | atr | structural
  primary_R: 1.5                    # v1.2: 2.0 -> 1.5 (sec11b WIN: yıllık +%9.5, dispersiyon dar)
  partial_close_at_R: 1.0           # 1R'da partial kapat (v1.0)
  runner_trail: true                # kalan trailing ile (engine default mult=1.0)
  # NOT: engine.tp2_R default 2.0 — orchestrator BacktestEngine(tp2_R=1.5) ile çağırmalı.

# Volatility-targeted sizing — opsiyonel kayıp koruma katmanı.
# Aktif olunca: yüksek-vol günlerde otomatik küçük pozisyon, düşük-vol günlerde büyük.
# Test sonucu: yıllar arası tutarlılık 1.7x iyileşti (σ %35→%21), getiri %32 (vs %36 baseline).
# Default kapalı; hazır olunca enable: true ile aç.
vol_target:
  enabled: false                    # production-ready ama default kapalı
  target_atr_pct: 0.04              # %4 günlük ATR hedef (BTC normal seviyesi)
  min_factor: 0.20                  # extreme high-vol max %80 size azaltma
  max_factor: 1.50                  # extreme low-vol max %50 size büyütme

leverage:
  enabled: true
  max_leverage_per_symbol: 5        # perpetual; confidence-based 1x-5x dynamic (v0.3 prod)
  max_portfolio_notional_x_equity: 5
  margin_safety_ratio: 0.5          # likidasyon mesafesi minimum %50
  confidence_tiers:                 # per-trade confidence map (engulfing v1)
    - {min: 0.00, max: 0.32, leverage: 1}
    - {min: 0.32, max: 0.42, leverage: 2}
    - {min: 0.42, max: 0.52, leverage: 3}
    - {min: 0.52, max: 0.58, leverage: 4}
    - {min: 0.58, max: 1.01, leverage: 5}

drawdown_breakers:
  daily_loss_pct: 0.05              # günlük net kayıp %5 → durdur
  weekly_loss_pct: 0.10             # haftalık %10 → durdur
  monthly_loss_pct: 0.99            # v1.5.1 PURE side-cond: combined disabled (+%19.9 ek)
  monthly_halt_days: 21             # halt period
  # v1.5.1 sec15.6 PURE SIDE-CONDITIONAL (mdd_combined disabled, +%136.2 / DD -%38.6 / r-adj 3.530)
  monthly_loss_pct_long: 0.15       # gevsek long (bull trend'leri yakala)
  monthly_loss_pct_short: 0.05      # siki short (1.66x karli, halt erken)
  # v1.5 STACK (A6 force-exit + side-cond HIBRIT): yıllık +%116.3 / DD -%34.9 / r-adj 3.332
  # v1.4 baseline: +%67.8 / DD -%34.8 / r-adj 1.946 (delta +%48.5pp)
  # PURE side-cond varyasyonu (mdd=disable): +%136.2 / DD -%38.6 / r-adj 3.530 ama DD +%4 ek
  consecutive_losses: 3             # v0.9.1: 6 -> 3 (sweep'te ROI+DD iyilestirir)
  consecutive_loss_pause_days: 5    # v0.9.1: 3 ardisik kayip -> 5 gun cool-down
  reset:
    daily: 00:00 UTC
    weekly: Monday 00:00 UTC
    monthly: 1st 00:00 UTC

correlation_gate:
  enabled: true
  max_pairwise_corr: 0.7            # 90-günlük getiri korelasyonu
  reduction_factor: 0.5             # >0.7 ise size yarıya iner
  hard_block_at: 0.9                # %90+ — pozisyonu reddet

concentration_limits:
  max_open_positions: 12            # v1.4 sec14.0: 8 -> 12 (slot bottleneck WIN +%7.6 yıllık)
  max_per_category_pct: 0.40        # tek kategori %40'tan fazla olamaz
  max_per_symbol_pct: 0.20          # tek sembol %20'den fazla olamaz
  # v0.9.3 PRESETS: backtest'te concentration_gate'i uygula (live'a yakin simulasyon).
  # production risk.yaml'da false — eski sayilarin uyumlulugunu korur.
  backtest_apply_concentration_gate: true

# v0.9.4 REGIME FILTER (Analyst HYP — capitulation halt)
# Backtest sweep onayli: BASELINE r%4'a halt ekleyince dispersiyon yariya iniyor.
# Min pencere yillik +%3.4 -> +%19.8 (6x), DD -%37 -> -%30.
regime_filter:
  btc_capitulation_halt_enabled: true
  atr_pct_threshold: 6.0           # 1d ATR / close * 100 >= %6
  ema200_streak_days: 10           # BTC < EMA200 son 10 gun
  dd_90d_threshold_pct: -25.0      # BTC 90d max-DD <= -%25
  # Resume: ATR% <= 4 AND BTC > EMA50 5 gun consec
  resume_atr_threshold: 4.0
  resume_streak_days: 5

# v0.9.7 ALT-DATA F&G FILTER (B3 sweep WIN-WIN)
# Fear&Greed value <=20 (extreme fear) -> short skip (contrarian)
# Etki: ROI +%3pp, DD aynı, dispersiyon dar kalır.
# Funding filter B0'da YOK (SUPER preset'te var, BALANCED'da F&G yeterli).
alt_data:
  fng_short_skip_enabled: true
  fng_short_skip_threshold: 20      # value <=20 -> short skip
  funding_filter_enabled: false     # BALANCED'da kapalı, F&G yeterli

# v0.9 — 11 sembol + Top 10 strateji + multi-target engine + 1.0 ATR trail
strategy_portfolio:
  enabled: true
  symbols:                          # 11 sembol (DOGE/XRP/MATIC eklendi)
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - ADA/USDT
    - AVAX/USDT
    - LINK/USDT
    - DOT/USDT
    - DOGE/USDT
    - XRP/USDT
    - MATIC/USDT
  strategies:                       # Top 10 — 11 sembolde test edilmis
    - engulfing_continuation
    - obv_engulfing_confluence
    - anchored_vwap_reversal        # YENI v0.9 — VWAP reversal
    # - wyckoff_phase_d             # 🔥 PHOENIX: WYK-001 disabled (lookahead leak + net DD ağırlığı)
    - brooks_h2_l2
    - pin_bar_round_numbers
    - equal_highs_sweep
    - cvd_spike_fade                # YENI v0.9 — CVD divergence
    - vsa_climax_test               # YENI v0.9 — VSA climax
    - brooks_failed_breakout
    - fvg_fill_reversal             # YENI v1.2 — Fair Value Gap (sec11e WIN: +%8.7 yıllık, alt-coin dominant)
  same_symbol_side_cooldown_days: 3
  max_concurrent_positions: 12      # v1.4 sec14.0: 8 -> 12 (slot bottleneck fix WIN: yıllık +%7.6)
  # v2.0 PYRAMIDING REKABE GERI (DUZELTME)
  # Önceki "honest" test'te yanlış varsayım: ek pos worst case -1R clip kullandım
  # Doğru: algoritmik pyramid auto-BE SL koyar -> reverse'de R = 0 (loss yok)
  # SIM = HONEST_BE matematiksel olarak AYNI (ispat: max(0, R-trigger) her durumda doğru)
  # Realistik tek ek: slippage erosion (~0.001R/trigger) -> -%0.5pp yıllık
  pyramid_enabled: true
  pyramid_triggers: [1.0, 2.0]
  pyramid_sizes: [0.50, 0.30]
  # NOT: cash bottleneck henüz model edilmedi (production_replay'da ek pos margin check yok)
  # Live'da -%2-5pp düşebilir; engine implement sonraki sprint için
  # mc=8 -> 12: +%60.2 -> +%67.8, DD aynı, r-adj 1.802 -> 1.946. mc=16 aynı sonuç (12 sweet spot).
  # ⚠️ concentration_max_per_symbol_pct=0.20 KORUNMALI (0.30 -> DD -%85 felaket).
  signal_confidence_min: 0.20
  # v0.9.9 NOTE: CEO drop_pairs eklenmesini onerdi (Ablation +%10.81pp)
  # ama production'da test edilince ETKISIZ cikti (BALANCED %36 -> %35).
  # Sebep: halt + F&G zaten dolayli olarak kotu pair'leri filterliyordu.
  # drop_pairs YORUM SATIRINDA — yeniden test edilirse kullanilabilir:
  # drop_pairs:
  #   - [anchored_vwap_reversal, ETH/USDT]
  #   - [anchored_vwap_reversal, LINK/USDT]
  #   - [anchored_vwap_reversal, BTC/USDT]
  #   - [pin_bar_round_numbers, BNB/USDT]
  #   - [equal_highs_sweep, BNB/USDT]
  #   - [equal_highs_sweep, ETH/USDT]
  #   - [pin_bar_round_numbers, BTC/USDT]
  #   - [pin_bar_round_numbers, ADA/USDT]
  #   - [equal_highs_sweep, AVAX/USDT]
  #   - [wyckoff_phase_d, DOT/USDT]
  expected_annual_return: 0.36      # v0.9.7 BALANCED (+F&G): 3y rolling +%36.1
  expected_max_dd: 0.30              # v0.9.7 BALANCED: DD -%30
  # 3y rolling stress (13 pencere — GERCEK referans):
  #   no cap (v0.9.1)        : yillik +%57.3, DD -%78 (baseline)
  #   cap 0.20               : yillik +%40.4, DD -%54 (siki, ROI dustu)
  #   cap 0.30 (production)  : yillik +%57.1, DD -%65 ⭐ (DD %13pp iyi)
  #   cap 0.50               : yillik +%96.4, DD -%77 (yuksek dispersiyon, guvensiz)
  # 5y in-sample tek pencere (referans ama yaniltici olabilir):
  #   cap 0.30 -> yillik %97.6 DD -%59 (sansa bagli, 3y rolling ile celiskili)

# v0.9 multi-target TP engine (1.0 ATR trail)
exit_engine:
  multi_target: true
  partial_close_1R: 0.30
  partial_close_2R: 0.30
  runner_pct: 0.40
  break_even_after_1R: true
  lock_1R_after_2R: true
  runner_trail_atr: 1.0             # v0.9: 0.7 -> 1.0 (let-run gevsek)

liquidity_gate:
  max_order_to_minute_volume: 0.01  # 1-dk hacmin %1'i tavanı
  min_book_depth_usdt: 100_000      # ±%1 derinlik tavanı

execution:
  order_type_default: post_only_limit
  fallback_to_market_after_sec: 30
  max_slippage_bps: 25              # 25 bps üstü → reject
  partial_fill_timeout_sec: 60
  # SEC26.B-5 — Post-Only Limit Slippage Gate (CONDITIONAL, paper test ZORUNLU)
  # Backtest assumption: 5bps × 2 = 10 bps round-trip
  # Paper trading gerçek slippage: 45.4 bps mean, max 85.8 bps (9× kötü)
  # Default: DISABLED — market order yolu (backward compat, replay etkisi: zero).
  # Paper trading 7-14 gün sonra fill_rate ölç:
  #   fill_rate >= %60 -> enable production
  #   fill_rate <  %60 -> keep disabled
  post_only_limit_enabled: false      # safe default — paper test sonrası enable
  post_only_fallback_seconds: 30      # post-only timeout, sonra market fallback
  slippage_limit_bps: 25              # market fallback slippage > limit -> reverse + raise

emergency:
  kill_switch_keyword: HALT_TRADING
  flatten_all_on_breaker: false     # breaker tetiklendiğinde mevcut açıkları KAPATMA (manuel onay)
  require_human_to_resume: true

# Phase1.B1 — Capital Cap (pre-live 30-gün zorunlu kısıt)
# Live deployment ilk 30 gün: max sermaye $1000 USDT.
# paper/backtest mode'da tamamen yoksayılır (live gate aşağıda).
# cap_expires_at geçince: cap inactive → warning log → None.
# enabled: false → hiçbir şey yapma (backward compat).
live_capital_cap:
  enabled: true
  max_equity_usdt: 1000.0
  cap_expires_at: "2026-06-14"      # 30 gün
  warn_threshold_pct: 0.80          # %80'e ulaştığında uyarı log
