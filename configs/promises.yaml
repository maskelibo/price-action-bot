# Component SLA Declarations (Faz 14.2 — Promise/Reality Detector).
#
# Her komponent ne yapacağını burada beyan eder.
# scripts/check_promises.py her saat bu söze karşı gerçek üretimi kontrol eder.
# İhlal → push_critical Telegram alert.
#
# Field tipleri:
#   min_per_24h: Son 24 saatte minimum X tane çıktı/event/file
#   max_silence_hours: Bu komponent N saatten fazla sessiz kalırsa alarm  # UYGULANMADI: check_promises.py bu tipi desteklemiyor (sessiz no-op, T2-06). Doğrulandı 2026-07-10
#   file_pattern: Bu glob pattern'a uyan dosyalar son 24h içinde yazılmalı
#   log_pattern: Daemon log'unda son 24h içinde bu regex en az N kez
#   journal_table: Bu DuckDB tablosuna son 24h içinde min N satır  # UYGULANMADI: check_promises.py bu tipi desteklemiyor (sessiz no-op, T2-06). Doğrulandı 2026-07-10
#
# severity: 'warn' (info push) | 'crit' (push_critical)
# enabled: false → skip check (geçici devre dışı bırakma)

components:

  # ─────────────────────────────────────────────────────────────
  # AGENTS
  # ─────────────────────────────────────────────────────────────

  researcher:
    description: "Hipotez üretimi (5-batch gece + gün içi pulse)"
    enabled: true
    severity: crit
    checks:
      - kind: file_pattern
        pattern: "memory/researcher/hypotheses/*.md"
        min_per_24h: 1
        comment: "Gece 02:30 5-batch + gün içi pulse → min 1 yeni hipotez/gün"
      - kind: log_pattern
        log: "logs/launchd/ceo.stdout.log"
        regex: "scheduler.researcher_pulse_done"
        min_per_24h: 1
        comment: "FIX 2026-07-07: researcher_5batch OTONOMI-1'de durduruldu (spin-loop) — eski researcher_5batch_done pattern'ı yalancı CRIT üretirdi; pulse 2×/gün koşuyor"
      - kind: file_pattern
        pattern: "memory/researcher/sweep_candidates.jsonl"
        max_age_hours: 26
        comment: "OTONOMI-1 feature_sweep gece 04:10 TR — kanıt fabrikası izlemesiz kalmasın"

  lab_scientist:
    description: "Param sweep + drift detect + tournament"
    enabled: true
    severity: warn
    checks:
      - kind: file_pattern
        pattern: "reports/param_sweep/chunks/*.jsonl"
        min_per_24h: 5
        comment: "Saatlik param sweep + 2-saatlik quick scan = ~30 chunk/gün, min 5 garanti"
      - kind: log_pattern
        log: "logs/launchd/ceo.stdout.log"
        regex: "scheduler.lab_quick_scan_done"
        min_per_24h: 3
        comment: "FIX 2026-07-06: cadence 2 Tem'de 12×→4×/gün düşürüldü (token disiplini); min 6 her gün yalancı alarm üretirdi"

  bot_monitor:
    description: "Saatlik bot health snapshot + günlük cards"
    enabled: true
    severity: warn
    checks:
      - kind: file_pattern
        pattern: "reports/bot_monitor/*snapshot*.md"
        min_per_24h: 20
        comment: "Saatlik snapshot → 24/gün, biraz tolerance ile 20"

  risk_officer:
    description: "Inbox review (saatlik :15)"
    enabled: true
    severity: warn
    checks:
      - kind: log_pattern
        log: "logs/launchd/ceo.stdout.log"
        regex: "risk_officer.(inbox_empty|batch_review_done)"
        min_per_24h: 20
        comment: "Saatlik :15 review, 20 min OK"

  ceo:
    description: "Daily brief (02:00 UTC) + arbitrate"
    enabled: true
    severity: crit
    checks:
      - kind: file_pattern
        pattern: "reports/ceo/*brief*.md"
        min_per_24h: 1

  adversary_engineer:
    description: "Günlük stres test (her bot için)"
    enabled: true
    severity: warn
    checks:
      - kind: file_pattern
        pattern: "reports/adversary/*stress*.md"
        min_per_24h: 1
        comment: "FIX 2026-07-07: futures5m emekli, stres listesinden çıktı → 1 bot × 1/gün (eski min 2, ölü botun raporuyla yapay geçiyordu)"

  strategy_curator:
    description: "Günlük correlation update"
    enabled: true
    severity: warn
    checks:
      - kind: file_pattern
        pattern: "reports/curator/*correlation*.md"
        min_per_24h: 1

  # ─────────────────────────────────────────────────────────────
  # BOTS
  # ─────────────────────────────────────────────────────────────

  futures15m_daemon:
    description: "15m signal scan + position monitor (v15p2)"
    enabled: true
    severity: crit
    checks:
      # FIX 2026-07-06: eski path logs/launchd/futures15m.stderr.log 15 Haz'da
      # emekli olan botun DONMUŞ loguydu — mtime-gate'siz tüm-dosya sayımıyla
      # sonsuza dek PASS ediyordu (v15p2 ölse alarm gelmezdi, kör nokta).
      - kind: log_pattern
        log: "logs/futures_daemon_v15p2.log"
        regex: "15M_SCAN: \\d+ sinyal"
        min_per_24h: 60
        comment: "Her 15dk tarama → 96/gün, tolerance ile 60"
      - kind: log_pattern
        log: "logs/futures_daemon_v15p2.log"
        regex: "POS_CHECK"
        min_per_24h: 60

  futures5m_daemon:
    description: "5m signal scan + position monitor — BOT EMEKLİ (30 Haz 2026)"
    enabled: false  # FIX 2026-07-06: 5m daemon 30 Haz'da kalıcı emekli (0 fill); donmuş log yalancı PASS veriyordu
    severity: crit
    checks:
      - kind: log_pattern
        log: "logs/launchd/futures5m.stdout.log"
        regex: "5M_SCAN: \\d+ sinyal"
        min_per_24h: 200
        comment: "Her 5dk tarama → 288/gün, tolerance ile 200"

  # ─────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────────────────────

  regime_features_refresh:
    description: "Daily regime features parquet refresh (00:01 UTC)"
    enabled: true
    severity: crit
    checks:
      - kind: file_pattern
        pattern: "data/regime_features_latest.parquet"
        max_age_hours: 26  # 24h beklenir, 2h tolerance
        comment: "Cron daily 00:01 UTC; >26h stale ise alert"

  llm_calls_audit:
    description: "Token tracking audit log"
    enabled: true
    severity: warn
    checks:
      - kind: file_pattern
        pattern: "data/llm_calls.jsonl"
        max_age_hours: 6
        comment: "LLM çağrı var mı, audit yazılıyor mu"

  # ─────────────────────────────────────────────────────────────
  # HAFTALIK GÜVENCE KATMANI (B-1 fix 2026-07-08, dalga-4 T4-HIGH)
  # ─────────────────────────────────────────────────────────────
  # Bulgu: 5 Tem 44h kesinti Pazar'ın TÜM haftalık cron pencerelerini yuttu;
  # APScheduler misfire_grace_time=3600 (1h) + coalesce=True → 44h misfire
  # sessizce ÇÖPE atıldı. weekly_token_report / adversary_weekly_red_team /
  # weekly_consolidation (+inbox arşivi) 2 HAFTA (28 Haz→12 Tem) sessizce
  # kör kaldı, hiçbir alarm çalmadı. promises.yaml'da haftalık job'lar için
  # TEK check yoktu. Eşik 216h (9 gün): normal koşum max 7 gün → alarm yok;
  # bir Pazar penceresi kaçarsa 9. günde WARN. severity=warn (para-riski değil,
  # güvence katmanı görünürlüğü). Grace_time'a DOKUNULMADI (restart-fırtınası
  # + B-7 çakışma riski — bkz T4).
  liq_collector:
    description: "Likidasyon feed collector (bybit) — canlılık (2026-07-10)"
    enabled: true
    severity: warn
    checks:
      - kind: file_pattern
        pattern: "logs/state/liq_collector_heartbeat.txt"
        max_age_hours: 1
        comment: "Flusher 30s'de bir touch eder; 1h bayat = collector ölü (KeepAlive'a rağmen) → veri kaybı başladı"

  weekly_assurance:
    description: "Haftalık güvence job'ları (Pazar cron'ları) kaçmasın"
    enabled: true
    severity: warn
    checks:
      - kind: file_pattern
        pattern: "reports/ops/*token-report*.md"
        max_age_hours: 216
        comment: "weekly_token_report — Pazar 05:00 UTC"
      - kind: file_pattern
        pattern: "reports/adversary/*weekly-*.md"
        max_age_hours: 216
        comment: "adversary_weekly_red_team — Pazar 04:30 UTC"
      - kind: file_pattern
        pattern: "memory/protocol/archive/*.jsonl"
        max_age_hours: 216
        comment: "weekly_consolidation inbox arşivi — Pazar 05:30 UTC"
      - kind: file_pattern
        pattern: "reports/curator/*lifecycle*.md"
        max_age_hours: 216
        comment: "curator_weekly_lifecycle — Pazar 06:30 UTC"
      - kind: file_pattern
        pattern: "reports/ceo/*weekly*.md"
        max_age_hours: 216
        comment: "weekly_principal_queue — Pazar 08:30 UTC"
