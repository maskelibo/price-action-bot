  pyramid_sizes: [0.50, 0.30]
  signal_confidence_min: 0.25    # 1d'de 0.20 → 0.25 (scalp gürültü filtresi)
  expected_annual_return: 0.60   # konservatif backtest beklentisi (master plan §2.5)
  expected_max_dd: 0.25

exit_engine:
  multi_target: true
  # DIFF vs 1d: scalp'te daha agresif kısmi realizasyon
  partial_close_1R: 0.40         # 1d %30 → %40
  partial_close_2R: 0.30
  runner_pct: 0.30               # 1d %40 → %30 (kısa hold, runner daha az)
  break_even_after_1R: true
  lock_1R_after_2R: true
  runner_trail_atr: 0.7          # 1d 1.0 → 0.7 (daha sıkı trailing scalp'
