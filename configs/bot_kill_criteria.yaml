# Bot kill criteria — Bot Monitor reads this hourly to decide WARN / PAUSE.
#
# `auto_pause: false` by default — Bot Monitor only writes recommendation docs.
# Principal manually pauses by stopping the daemon or editing this file to
# tighten/loosen thresholds.
#
# Per-bot block:
#   journal             — DuckDB path holding futures_trades_closed table
#   kill_thresholds:
#     cum_loss_7d_pct   — last 7d cumulative realized loss as fraction of starting equity
#     cum_loss_14d_pct  — same window, 14d
#     max_drawdown_pct  — rolling 30d max drawdown threshold
#     consecutive_losses— ardışık kapanmış loss trade sayısı
#
# Defaults block:
#   warn_first          — true → ilk eşik aşımında WARN doc, PAUSE öneri 24h sonra
#   warn_hold_hours     — WARN ile PAUSE öneri arasındaki minimum süre (saat)
#   auto_pause          — false → asla otomatik pause (sadece öneri)
#   alert_channel       — telegram | slack | email (downstream notifier okur)

# account_equity_usdt — hesabın baz sermayesi. cum_loss_*_pct ve
# max_drawdown_pct bu değere ORANLANIR (config'in vaadi: "fraction of
# starting equity"). FIX 2026-05-30: önceden bu yoktu; metrikler sıfır-bazlı
# kümülatif PnL eğrisinden hesaplanıyordu → %43 gibi ŞİŞMİŞ yanlış-pozitif
# PAUSE alarmı (zirve kümülatif kâra oran, hesap büyüklüğüne değil). Paper
# hesap = 10000 USDT (logs/execution/paper_state_faz6.json).
bots:
  # FIX 2026-07-07 (denetim CRIT): canlı v15p2 botu bu dosyada YOKTU —
  # gece kill-eval emekli botların donmuş journal'larına bakıp sonsuza dek
  # 0 hesaplıyordu; tek para-dokunur bot korumasızdı. Eşikler futures15m
  # setinden devralındı; equity = v15p2 temiz anchor (2 Tem, $4963).
  v15p2:
    journal: data/futures_journal_v15p2.duckdb
    account_equity_usdt: 4963.0
    kill_thresholds:
      cum_loss_7d_pct: 0.10
      cum_loss_14d_pct: 0.15
      max_drawdown_pct: 0.25
      consecutive_losses: 7
  # RETIRED 2026-06-15 (v13/v14 dönemi journal donuk) — kayıt için tutuluyor.
  futures15m:
    enabled: false
    journal: data/futures_journal.duckdb
    account_equity_usdt: 10000.0
    kill_thresholds:
      cum_loss_7d_pct: 0.10
      cum_loss_14d_pct: 0.15
      max_drawdown_pct: 0.25
      consecutive_losses: 7
  # RETIRED 2026-06-30 (5m bot kalıcı emekli) — kayıt için tutuluyor.
  futures5m:
    enabled: false
    journal: data/futures_journal_5m.duckdb
    account_equity_usdt: 10000.0
    kill_thresholds:
      cum_loss_7d_pct: 0.08
      cum_loss_14d_pct: 0.12
      max_drawdown_pct: 0.20
      consecutive_losses: 5

defaults:
  warn_first: true
  warn_hold_hours: 24
  auto_pause: false   # Sadece öneri, Principal manuel onay
  alert_channel: telegram
  account_equity_usdt: 10000.0  # per-bot override yoksa bu kullanılır
