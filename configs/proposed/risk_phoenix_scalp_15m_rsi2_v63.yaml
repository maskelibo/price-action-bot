name: rsi_phoenix_scalp_15m_rsi2_v63
version: v63-deploy-candidate
description: |
  rsi2-extreme-fade 7-round iterate champion.
  Companion strategy adayı — vsa_climax (live) ile düşük korelasyon beklenir.

strategy:
  module: rsi2_extreme_fade
  class: RSI2ExtremeFadeStrategy
  timeframe: 15m

universe:
  symbols:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - XRP/USDT
    - DOGE/USDT
    - ADA/USDT
    - AVAX/USDT
    - LINK/USDT
    - DOT/USDT

execution:
  risk_per_trade: 0.005           # %0.5 (LIVE config ile aynı)
                                  # HALF-KELLY önerisi: 0.0025
  max_concurrent: 8               # LIVE 16'dan azaltılmış
  consecutive_loss_pause: 3       # 3 art arda kayıp → 1 gün halt (SİHİRLİ SOS)
  pause_days: 1                   # halt süresi (1 gün)
  tp_r: 3.0                       # 3R fixed TP (big winner yakalama)

  # ÖNEMLI: sl_pct_min YOK
  # vsa_climax'ta widestop %2.5 vardı, rsi2'de bu filtre %96 trade'i keser
  # rsi2 doğası dar SL — DEĞIŞMEMELI
  sl_pct_min: 0.0

  # DD halt'lar — loss_pause yeterli, ekstra koruma yok
  daily_dd_halt_pct: null
  monthly_dd_halt_pct: null

signals:
  rsi_period: 2
  rsi_oversold: 10
  rsi_overbought: 90
  confirmation: engulfing_bar

position_sizing:
  risk_pct: 0.005
  backtest_risk_pct: 0.005

