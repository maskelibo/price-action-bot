# =============================================================================
# G11/G12 FIX (hard review 2026-05-21): EXECUTION / FEE MODELI
# =============================================================================
# ÖNCE: bu blok YOKTU → lab.py:475 `raw.get("execution", {})` boş dict döndürüp
# fee_bps_per_trade=0.0 (zero-fee) varsayıyordu. İdealize +%1253 backtest'inin
# kök sebebi BUYDU — fee erozyonu hiç simüle edilmiyordu.
#
# Consuming code: lab.py:474-477
#   fee_bps_per_trade = float(raw["execution"]["fee_bps_per_trade"])
# Birim (lab.py:316 yorumu): "round-trip fee in basis points (entry + exit
# combined)". Formül lab.py:700 base_fee_R = fee_bps_per_trade / (sl_pct*10_000)
# tek terimle hem entry hem exit leg'ini kapsıyor → değer ROUND-TRIP yazılmalı.
#
# Gerçekçi değer: Binance USDM futures taker ~7.5 bps/leg (VIP-0 0.05% +
# spread/slippage payı). Round-trip = 2 leg ≈ 15 bps. Bu, taker-only worst-case
# senaryo (post_only maker fill ile düşer ama o henüz canlıda doğrulanmadı —
# defensive olarak taker varsay).
# =============================================================================
execution:
  fee_bps_per_trade: 15.0   # round-trip (entry+exit), Binance USDM taker ~7.5bps/leg
  # WIRE-widestop (2026-05-22): wide-stop deploy filter. Reject signals/trades
  # whose entry sl_pct = |entry - sl| / entry < this threshold. sl_pct is known
  # at entry from ATR -> causal, no look-ahead. 0.0 = OFF (c2v5 default).
  # Consuming code: lab.py ProductionConfig.sl_pct_min (backtest) +
  # futures_daemon.py _sl_pct_min_15m (live 15m signal loop). DEPLOY spec:
  # DEPLOY_widestop_15m.md WIRE steps 1-2.
  sl_pct_min: 0.025
  # POST-ONLY MAKER — 2026-05-21 karar (viability raporu: pool-R taker ~0, maker +110-164K sim)
  # Fill rate ölçüldü: %87.5 (break-even %2.6). post_only_limit_enabled: true = AÇIK.
  # Consuming code: futures_daemon.py 15m entry path + PyramidRouter init.
  post_only_limit_enabled: true
  post_only_fallback_seconds: 30
  slippage_limit_bps: 25         # entry leg market-fallback slippage cap
  # Pyramid leg market-fallback cap ayrı tutulur: trigger noktasında spread
  # genişleyebilir (fiyat geri çekilip tetik sınırında döndüğünde), 25bps entry
  # için mantıklı ama pyramid için çok sıkı → gereksiz reverse-close kaybı.
  # 50bps: pozisyon R boyutunun ~%0.5'i, kabul edilebilir (max 3 leg × 50bps = 150bps/yıl).
  pyramid_slippage_limit_bps: 50

position_sizing:
  method: confidence_dynamic
  # DIFF vs 1d: %4 → %2
  # Gerekçe: 13,500 trade/yıl × 8 bps taker = %108 fee erosyon baseline.
  # %2 risk + maker rebate ile breakeven yakını hedeflenir.
  # Kelly cap %25 → %15: daha yüksek trade frekansta Kelly daha aşırı büyür.
  # WIRE-widestop (2026-05-22): %2 -> %0.5. The wide-stop DD-optimised backtest
  # (+12.67%/ay, DD -20.7%) used FLAT 0.5% risk; live must match for parity.
  # NOTE: confidence_risk_tiers below have NO consumer in src/ (engine uses
  # backtest_risk_pct; use_confidence_dynamic_sizing not set) — left as-is.
  risk_per_trade: 0.0075  # v14p2: tavan config (0.0062 -> 0.0075)
  backtest_risk_pct: 0.0075  # v14p2
  # FAZ-2a: strateji risk ağırlıkları (ölçülen meanR'den: vsa 1.80 / brooks 0.84
  # / avwap 0.40 / engulf 0.33). Cap'lerden ÖNCE çarpılır (lab.py paritesi).
  strategy_risk_weights:
    vsa_climax_test: 1.4
    brooks_failed_breakout: 1.1
    anchored_vwap_reversal: 0.6
    engulfing_continuation: 0.6
    grimes_abc_pullback: 1.0   # FAZ-3: ön-deklare nötr ağırlık (tur-15 backtest)
  # FAZ-2b: DD-throttle — peak-equity'den %6 düşüşte yeni giriş riski yarıya.
  dd_throttle:
    enabled: true
    dd_threshold: 0.06
    risk_mult: 0.5
    state_path: logs/risk/equity_peak_v14.json
  confidence_risk_tiers:
    - {min: 0.00, max: 0.32, risk_pct: 0.005}   # %0.5 — micro
    - {min: 0.32, max: 0.42, risk_pct: 0.008}   # %0.8
    - {min: 0.42, max: 0.52, risk_pct: 0.018}   # %1.2 — default
    - {min: 0.52, max: 0.58, risk_pct: 0.024}   # %1.6
    - {min: 0.58, max: 1.01, risk_pct: 0.030}   # %3.0 — yüksek conf
  # DIFF vs 1d: 0.25 → 0.15 (scalp'te Kelly patlaması riski daha yüksek)
  kelly_cap: 0.15
  min_quantity_usdt: 10
  size_rounding: exchange_step
  # SEC58 FIX: 0.30 -> 0.15 to match max_per_symbol_pct (0.30 caused concentration_gate REJECT at 0 positions)
  max_notional_pct_equity: 0.15  # SEC58 FIX: align with max_per_symbol_pct=0.15 (was 0.30 -> concentration_gate paradox)
  # G16 FIX (hard review 2026-05-21): side-concentration limit — max 4 long VEYA
  # 4 short ayni anda. 8/8 pencere AYNI YON kaybinin yapisal sebebi yon-konsantrasyon
  # limitinin olmamasiydi. risk_defensive.yaml referans degeri = 4.
  # NOT: lab.py:434 bu key'i `position_sizing` blogundan okuyor
  # (ps = raw["position_sizing"]) — `concentration_limits` blogundan DEGIL.
  # backtest_apply_concentration_gate'den bagimsiz, her zaman aktif.
  max_same_side_concurrent: 4

stop_loss:
  method: atr
  # DIFF vs 1d: period 14 barsın 15m karşılığı = 3.5 saat ATR
  # 1d'de 14 bar = 14 gün; 15m'de 14 bar = 3.5 saat — TF parametrize edilmeli
  # manifest layer'da: atr_period_bars: 14 (her TF'de kendi barı)
  atr_period: 14
  # DIFF vs 1d: multiplier 2.0 → 1.5 (scalp'te geniş SL fee'den büyük olur)
  atr_multiplier: 1.5
  structural_buffer_pct: 0.003   # 1d %0.5 → %0.3 (daha sıkı scalp buffer)
  trailing:
    enabled: true
    method: atr_chandelier
    atr_period: 14
    # DIFF vs 1d: 3.0 → 2.0 (scalp'te runner daha kısa sürer)
    # FIX 2026-05-29 (deploy): 2.0 → 3.0 (winner-let-run; runner'a daha geniş trail).
    # REVERT 2026-06-02: 3.0 → 1.5. Characterization (champion_characterization.md §11,
    #   55bps): trail 3.0 = edge-yıkıcı (−%1.1/ay, MaxDD −%66). BASELINE 1.5 = +%7.6/ay,
    #   MaxDD −%18. Canlı daemon bu alanı OKUMUYOR (hardcoded _TRAIL_PCT=0.04) → bu sadece
    #   landmine temizliği; backtest araçları bundan sonra doğrulanmış 1.5 okur.
    multiplier: 1.5
    activate_after_R: 1.0

take_profit:
  method: r_multiple
  # DIFF vs 1d: 1.5 → 1.2R (scalp'te hızlı kâr realizasyonu, fee etkisi büyük)
  primary_R: 1.2
  partial_close_at_R: 0.8       # 0.8R'da kısmi kapat (1d'de 1.0R)
  runner_trail: true

vol_target:
  # DIFF vs 1d: aktif (1d'de kapalı) — scalp'te vol spike'larında auto-shrink
  enabled: true
  input_metric: entry_stop_distance_pct
  # 15m ATR% hedef: 1d %4 → 15m ~%1 (TF-scaled; 1d vol / sqrt(96 bar) ≈ %0.4-1)
  target_atr_pct: 0.010
  min_factor: 0.20
  max_factor: 1.50

leverage:
  enabled: true
  # DIFF vs 1d: max 5 → 3 (scalp'te kaldıraç × volatilite likidasyon riski)
  max_leverage_per_symbol: 3
  max_portfolio_notional_x_equity: 3
  margin_safety_ratio: 0.5
  confidence_tiers:
    - {min: 0.00, max: 0.32, leverage: 1}
    - {min: 0.32, max: 0.52, leverage: 2}
    - {min: 0.52, max: 1.01, leverage: 3}

drawdown_breakers:
  # DIFF vs 1d: %5 → %3 → %5 → %4 (SEC54.6c 2026-05-19 YOL-B Lab tavsiye)
  # Gerekçe: SEC54.6b (daily=4% solo) hala 3/5 mandate, 2 FAIL (max_loss -%13.29,
  # neg ay 10/61). Forensic: tek-param (daily) revize tail riski kapatmıyor.
  # YOL-B: daily=4% kompromi KORU + consec=5 + m_short=4% geri dön (SEC54.1).
  # Beklenen: tail close (max_loss ~-%5-6), neg ay 10 → ≤9 (PRIMARY hedef).
  # Reference: reports/lab/2026-05-19_sec54_6b_compromise_replay.md §"Refined Lab
  # Recommendation — Yeni Yol" YOL-B.
  # WIRE-widestop (2026-05-22): 0.04 -> 0.02 (DD-optimised wide-stop config).
  daily_loss_pct: 0.04   # v14-frontier: 0.02 -> 0.04
  # DIFF vs 1d: %10 → %08 (scalp haftalık fırsat penceresi daha dar)
  # WIRE-widestop (2026-05-22): 0.08 -> 0.05 (DD-optimised wide-stop config).
  weekly_loss_pct: 0.08  # v14-frontier: 0.05 -> 0.08
  # combined monthly — side-cond ile birlikte; 0.99 = effectively off (pure side-cond)
  monthly_loss_pct: 0.99
  monthly_halt_days: 3           # 1d'de 21 → 3 gün (15m rejim değişim hızı)
  daily_halt_days: 1
  weekly_halt_days: 2
  # DIFF vs 1d: long %15 → %10 → %12 (SEC54.6c 2026-05-19 YOL-B: long KORUNDU)
  #             short %5 → %4 → %7 → %4 (SEC54.6c 2026-05-19 YOL-B GERİ)
  # Gerekçe: SEC54.6b forensic 2025-Q2 sell-off m_short=7% gevşeklik tail
  # açıyor. m_short=4% (SEC54.1) erken-çıkış-recovery'yi keser; PRIMARY hedef
  # neg ay 10 → ≤9 kapatma için sıkı tutmak gerek. Long m_long=12% korunur
  # (long-tail ay 2/61, kısma alpha cost yüksek; symmetric değil asymetric).
  monthly_loss_pct_long: 0.12
  monthly_loss_pct_short: 0.04
  # DIFF vs 1d: 3 → 5 → 7 → 5 (SEC54.6c 2026-05-19 YOL-B GERİ)
  # Gerekçe: SEC54.6 7'ye yükseltme false-alarm önlemekti ama tail (max_loss
  # -%13) consec=7 ile 7 consec losses arka-arkaya birikme şansı veriyor. 5
  # consec ile erken cool-down (1 gün pause) tail biriktirmeyi keser. Lab
  # SEC54.6b forensic: SEC54.1 daily=3% düşüklüğü sadece sebep değil; consec=5
  # + m_short=4% kombinasyonu tail kapatan asıl mekanizma.
  consecutive_losses: 5
  # DIFF vs 1d: 5g → 1g (15m rejim 3-7 gün sürer; uzun halt fırsat kaybı)
  # UYARI (kod bug): breaker.py satır 128 → int(pause_days) → int(1.0) = 1 TAMAM.
  # 5m ve 1m için 0.5/0.25 değerler int() sonrası 0 olur → ayrı nota ekle.
  consecutive_loss_pause_days: 1.0
  reset:
    daily: 00:00 UTC
    weekly: Monday 00:00 UTC
    monthly: 1st 00:00 UTC

correlation_gate:
  enabled: true
  # DIFF vs 1d: aynı (0.7/0.9) — korelasyon TF bağımsız; pairwise return
  # hesaplama 15m bar bazlı olacak (manifest layer sync gerekli)
  max_pairwise_corr: 0.7
  reduction_factor: 0.5
  hard_block_at: 0.9

concentration_limits:
  # DIFF vs 1d: 12 → 16 (15m daha fazla eş zamanlı fırsat; throughput gerekli)
  max_open_positions: 16
  max_per_category_pct: 0.35     # 1d %40 → %35 (intraday konsantrasyon riski)
  # DIFF vs 1d: %20 → %15 (sıkılaştı; master plan §1.3 "en çok %20" ama scalp'te
  # daha agresif fiyat hareketleri var, %15 daha güvenli)
  max_per_symbol_pct: 0.15
  backtest_apply_concentration_gate: true

# Regime filter — TF-scaled
# DIFF vs 1d: 1d ATR% eşiği 6.0 → scalp'te aynı KORUNDU (BTC günlük ATR% ölçüm
# değişmez; halt calendar 1d OHLCV bazlı). Halt süresi 21g → 3g (§2.4: 15m rejim
# değişim hızı 3-7 gün).
regime_filter:
  # SEC50 (2026-05-17): 1d-kalibre halt threshold'ları 15m'de over-reject.
  # Sweep ATR×DD (9 senaryo) + halt OFF baseline: halt OFF her dimension'da en iyi.
  # Mean monthly +%17.33 → +%28.87 (+%11.5pp), CV %223 → %144, zero ay 20 → 2,
