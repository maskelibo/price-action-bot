    owner_agent: risk_officer
    auditor: audit_risk
    inherent_risk: critical
    cadence: daily
    controls: []               # (Faz 3) Kelly-cap + config tutarlılık
  risk.breaker_killcriteria:
    domain: risk
    owner_agent: risk_officer
    auditor: audit_risk
    inherent_risk: critical
    cadence: daily
    controls: [CT-RSK-01]      # MaxDD baz hatası (%43 şişme)
  risk.gates:
    domain: risk
    owner_agent: risk_officer
    auditor: audit_risk
    inherent_risk: critical
    cadence: daily
    controls: []               # (Faz 3) correlation/concentration exception oranı
  risk.regime_filter:
    domain: risk
    owner_agent: risk_officer
    auditor: audit_risk
    inherent_risk: high
    cadence: daily
    controls: []               # (Faz 3) regime cache freshness + eşik tutarlılık
  portfolio.allocator:
