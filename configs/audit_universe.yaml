# Denetim Evreni (Audit Universe) — İç Denetim Departmanı (3. savunma hattı).
#
# audit_chief sahibi. TÜM denetçiler READ eder. Her işleyiş/süreç burada bir
# denetçiye + risk derecesine + cadence'e + kontrol-test listesine haritalanır.
# audit_chief haftalık KAPSAMA-BOŞLUĞU taraması koşar: eksik (owner_agent/auditor/
# controls) olan süreç = uncovered_process bulgusu. ("Açıkta kalan var mı?")
#
# Şema (process başına): domain, owner_agent (1. hat), auditor (3. hat),
#   inherent_risk (critical|high|med|low), cadence (daily|weekly), controls [CT-...].
#
# FAZ 2: ~50 işleyişin tamamı. controls'u olmayan satırlar Faz 3'te kontrol-testi
# kazanacak (şimdilik 'controls: []' → kapsama taraması bunları "kontrol eksik" işaretler,
# bu BİLİNÇLİ bir backlog sinyalidir).

meta:
  owner: audit_chief
  framework: "IIA Three Lines Model + COSO Internal Control"
  reviewed: 2026-05-30
  phase: 2

processes:
  # ============ VERİ (audit_data) ============
  data.ingest_ccxt_hourly:
    domain: data
    owner_agent: data_engineer
    auditor: audit_data
    inherent_risk: high
    cadence: daily
    controls: [CT-DAT-01]      # ingest↔trading evreni (3538-vs-14 / 14-vs-19)
  data.ingest_15m_live:
    domain: data
    owner_agent: data_engineer
    auditor: audit_data
    inherent_risk: high
    cadence: daily
    controls: []               # (Faz 3) 15m freshness/gap kontrolü
  data.quality_checks:
    domain: data
    owner_agent: data_engineer
    auditor: audit_data
    inherent_risk: med
    cadence: daily
    controls: []
  data.market_snapshot:
    domain: data
    owner_agent: data_engineer
    auditor: audit_data
    inherent_risk: high
    cadence: daily
    controls: []               # (Faz 3) snapshot atomiklik + freshness
  data.duckdb_storage:
    domain: data
    owner_agent: data_engineer
    auditor: audit_data
    inherent_risk: high
    cadence: daily
    controls: [CT-DAT-04]      # ÖNGÖRÜ: DuckDB kilit/bozulma (ingest15m exit-1)
  data.rag_corpus:
    domain: data
    owner_agent: data_engineer
    auditor: audit_data
    inherent_risk: low
    cadence: weekly
    controls: []
  data.alt_data:
    domain: data
    owner_agent: data_engineer
    auditor: audit_data
    inherent_risk: low
    cadence: weekly
    controls: []

  # ============ RİSK + PORTFÖY (audit_risk) ============
