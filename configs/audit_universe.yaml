    owner_agent: portfolio_manager
    auditor: audit_risk
    inherent_risk: high
    cadence: daily
    controls: []
  ops.paper_gate:
    domain: risk
    owner_agent: ops_engineer
    auditor: audit_risk
    inherent_risk: med
    cadence: daily
    controls: []

  # ============ EXECUTION + DAEMON (audit_execution) ============
