# ARCHIVED: 5m KILL 2026-05-17 — pool mR ≈ -0.37 at 5y span, fee-structural fail. Keep for reference / future 15m TF calibration baseline.
# pin_bar_round_numbers — 5m TF manifest override
# Kaynak: Signal Chief, SEC-SCALP-S7, 2026-05-17
#
# Kalibrasyon: 15m → 5m (x3)
#   sr_lookback   : 15m=192bar(48h) → 5m=576bar(48h) [cap: 288bar=24h perf]
#   vol_z_min     : 15m=1.0 → 5m=1.2 [5m'de round'a cok sik ulasiliyor]
#   wick_ratio    : 15m=0.65 → 5m=0.68 [5m gurultusunde daha siki wick]
#   body_ratio_max: 15m=0.30 → 5m=0.28 [daha temiz pin]
#   primary_R     : 15m=1.5 → 5m=1.2
#
# 5m'de round number'a ulasim 15m'ye gore 3x daha sik.
# vol_z ve wick kalite filtreleri sinyal sayisini dengeler.

name: pin_bar_round_numbers
version: "1.0.0-5m"
description: "Pin bar at round number levels — 5m intraday. SEC-SCALP-S7."

trend_filter:
  type: ema
  period: 50
  required: false

signals:
  patterns:
    - id: bullish_pin_at_round
      enabled: true
      weight: 2.0
      params:
        body_ratio_max: 0.28            # 15m=0.30 → 5m=0.28 [daha temiz]
        wick_ratio_min: 0.68            # 15m=0.65 → 5m=0.68 [daha uzun wick]
        round_proximity_atr: 0.3        # degismedi; oransal

    - id: bearish_pin_at_round
      enabled: true
      weight: 2.0
      params:
        body_ratio_max: 0.28
        wick_ratio_min: 0.68
        round_proximity_atr: 0.3

  structure:
    swing:
      fractal_n: 2
    support_resistance:
      lookback_bars: 288                # 5m=288bar(24h) [48h cok agir]
      cluster_atr_multiplier: 0.35
      min_touches: 2
      max_age_bars: 288
    require_proximity_to_sr_atr: 0.0

  filters:
    atr_min_pct: 0.001
    volume_zscore_min: 1.2              # 15m=1.0 → 5m=1.2 [round'a sik ulasiliyor]
    kaufman_er_period: 14
    kaufman_er_min: 0.0
    bear_regime_size_factor: 0.5

  confluence:
    method: weighted_sum
    min_score: 1.5
    bonus_if_at_sr: 0.5

risk:
  stop_loss:
    method: pin_tail
    tail_atr_buffer: 0.5
  take_profit:
    method: r_multiple
    primary_R: 1.2                      # 15m=1.5 → 5m=1.2
  position_sizing:
    method: fixed_fractional
    risk_per_trade: 0.01

backtest:
  warmup_bars: 400
  fees:
    taker: 0.00040
    maker: -0.00010
  slippage_bps: 8.0
  initial_capital_usdt: 10000.0
