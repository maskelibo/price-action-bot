# ARCHIVED: 5m KILL 2026-05-17 — pool mR ≈ -0.37 at 5y span, fee-structural fail. Keep for reference / future 15m TF calibration baseline.
# engulfing_continuation — 5m TF manifest override
# Kaynak: Signal Chief, SEC-SCALP-S7, 2026-05-17
#
# Kalibrasyon mantigi (15m → 5m, carpan x3):
#   1 barda 5m = 5 dak, 15m = 15 dak → 15m'deki her bar = 5m'de 3 bar
#
#   pullback_window: 15m=20bar(5h) → 5m=60bar(5h)  [zaman koru]
#   vol_z window   : 15m=60bar(15h) → 5m=288bar(24h) [gun eşdeğeri]
#   swing_lookback : 15m=15bar(225dk) → 5m=45bar(225dk) [zaman koru]
#   sr_lookback    : 15m=96bar(24h) → 5m=288bar(24h) [gun eşdeğeri]
#   primary_R      : 15m=1.5 → 5m=1.2 [daha kisa hold, yuksek fee etkisi]
#   vol_z_min      : 15m=0.5 → 5m=0.8 [5m daha gurultulu → daha siki filtre]
#   atr_min_pct    : 15m=0.003 → 5m=0.002 [5m ATR% daha kucuk]
#
# UYARI: 5m'de fee+slippage etkisi kritik.
#   taker 4bps/leg = round-trip 8bps + 7.5bps slip = 15.5bps min edge needed.
#   primary_R=1.2 ile: min WR = 1/(1+1.2) = %45.5 gerekli.

name: engulfing_continuation
version: "1.0.0-5m"
description: "Engulfing bar after EMA pullback — 5m intraday parametreleri. SEC-SCALP-S7."

trend_filter:
  type: ema
  period: 50            # 50 x 5m = 250 dak = 4.17h — session trend proxy
  required: true

signals:
  patterns:
    - id: bullish_engulfing_cont
      enabled: true
      weight: 1.5
      params:
        body_ratio_min: 0.55            # 15m ile ayni; 5m'de gurultu toleransi
        pullback_window: 60             # 15m=20bar(5h) → 5m=60bar(5h) [zaman koru]
        pullback_touch_atr: 0.4         # 15m ile ayni

    - id: bearish_engulfing_cont
      enabled: true
      weight: 1.5
      params:
        body_ratio_min: 0.55
        pullback_window: 60
        pullback_touch_atr: 0.4

  structure:
    swing:
      fractal_n: 2
    support_resistance:
      lookback_bars: 288                # 15m=96bar(24h) → 5m=288bar(24h)
      cluster_atr_multiplier: 0.4       # 15m=0.4; 5m ATR daha kucuk, tolerans koru
      min_touches: 2
      max_age_bars: 288
    require_proximity_to_sr_atr: 0.5

  filters:
    atr_min_pct: 0.002                  # 15m=0.003; 5m ATR% daha kucuk
    volume_zscore_min: 0.8              # 15m=0.5 → 5m=0.8 (daha gurultulu → siki filtre)
    kaufman_er_period: 14               # 14 x 5m = 70 dak; OK
    kaufman_er_min: 0.12               # 15m=0.15; 5m daha gurultulu → biraz gevset
    always_in_required: false
    bear_regime_size_factor: 0.5
    rolling_sharpe_period: 288          # 15m=96bar(24h) → 5m=288bar(24h)

  confluence:
    method: weighted_sum
    min_score: 1.5
    bonus_if_at_sr: 0.5

risk:
  stop_loss:
    method: structural
    swing_lookback: 45                  # 15m=15bar(225dk) → 5m=45bar(225dk)
  take_profit:
    method: r_multiple
    primary_R: 1.2                      # 15m=1.5; 5m daha kisa hold + yuksek fee = 1.2R
  position_sizing:
    method: fixed_fractional
    risk_per_trade: 0.01                # 5m icin muhafazakar risk

backtest:
  warmup_bars: 600                      # 15m=300bar(75h) → 5m=600bar(50h) [yeterli]
  fees:
    taker: 0.00040                      # Binance 5m taker: ~4bps per leg
    maker: -0.00010
  slippage_bps: 8.0                     # 5m slippage est: 6-10bps (15m'den biraz yuksek)
  initial_capital_usdt: 10000.0
