# ARCHIVED: 5m KILL 2026-05-17 — pool mR ≈ -0.37 at 5y span, fee-structural fail. Keep for reference / future 15m TF calibration baseline.
# vsa_climax_test — 5m TF manifest override
# Kaynak: Signal Chief, SEC-SCALP-S7, 2026-05-17
#
# Kalibrasyon: 15m → 5m (x3)
#   wait_min   : 15m=4bar(1h) → 5m=12bar(1h) [zaman koru]
#   wait_max   : 15m=24bar(6h) → 5m=72bar(6h)
#   vol_sma    : 15m=40bar(10h) → 5m=120bar(10h)
#   confirm_max_wait: 15m=5bar(75dk) → 5m=15bar(75dk)
#   vol_sma_mult: 15m=3.0 → 5m=3.5 [5m'de daha sik spike → esik arttirildi]
#   primary_R  : 15m=2.5 → 5m=2.0 [VSA move 5m'de daha kisa]
#
# VSA nadir event uyarisi:
#   15m'de gunluk 1-3 SC + test. 5m'de teorik olarak 3x daha fazla.
#   Ancak vol_sma_mult=3.5 ile sadece gercek climax'lar filtreler.

name: vsa_climax_test
version: "1.0.0-5m"
description: "VSA Selling Climax + Test Bar — 5m intraday. SEC-SCALP-S7."

trend_filter:
  type: ema
  period: 200
  required: false

signals:
  patterns:
    - id: vsa_sc_test_long
      enabled: true
      weight: 2.0
      params:
        spread_atr_mult: 1.5            # degismedi; oransal
        vol_sma_mult: 3.5               # 15m=3.0 → 5m=3.5 [daha siki]
        close_pos_min: 0.50
        min_low_bars: 5
        wait_min: 12                    # 15m=4bar(1h) → 5m=12bar(1h)
        wait_max: 72                    # 15m=24bar(6h) → 5m=72bar(6h)
        low_tolerance_pct: 0.02         # 15m ile ayni
        vol_ratio_max: 0.75
        spread_atr_max: 0.80
        close_pos_min_tb: 0.50

    - id: vsa_bc_thrust_short
      enabled: true
      weight: 2.0
      params:
        spread_atr_mult: 1.5
        vol_sma_mult: 3.5
        close_pos_max: 0.50
        max_high_bars: 5
        wait_min: 12
        wait_max: 72
        high_tolerance_pct: 0.02
        vol_ratio_max: 0.75
        spread_atr_max: 0.80

  structure:
    swing:
      fractal_n: 2
    support_resistance:
      lookback_bars: 288
      cluster_atr_multiplier: 0.35
      min_touches: 2
      max_age_bars: 288
    require_proximity_to_sr_atr: 0.0

  filters:
    atr_min_pct: 0.001
    volume_zscore_min: 0.0

  confluence:
    method: weighted_sum
    min_score: 1.5
    bonus_if_at_sr: 0.0

risk:
  stop_loss:
    method: sc_low_atr
    atr_buffer: 1.0
  take_profit:
    method: r_multiple
    primary_R: 2.0                      # 15m=2.5 → 5m=2.0
  position_sizing:
    method: fixed_fractional
    risk_per_trade: 0.01

# vsa_internals: kod bu bloku okur (vol_sma_period, atr_period, confirmation_max_wait)
vsa_internals:
  atr_period: 20                        # 20 × 5m = 100 dak; OK
  vol_sma_period: 120                   # 15m=40bar(10h) → 5m=120bar(10h) [HARDCODE FIX]
  confirmation_max_wait: 15             # 15m=5bar(75dk) → 5m=15bar(75dk)

backtest:
  warmup_bars: 400                      # vol_sma=120 + wait_max=72 + buffer
  fees:
    taker: 0.00040
    maker: -0.00010
  slippage_bps: 8.0
  initial_capital_usdt: 10000.0
