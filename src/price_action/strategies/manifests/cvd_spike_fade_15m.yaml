# cvd_spike_fade — 15m TF manifest override
# Kaynak: SEC-SCALP-S5 / Signal Chief 2026-05-17
#
# Kalibrasyon mantigi:
#   1d ref → 15m esiti (1d = 96 × 15m)
#
#   obv_lookback=30bar  → 1d'de 30 gun. 15m'de 30bar = 7.5h.
#     OBV z-score window: 7.5h ~1 trading gunu. Bu kabul edilebilir.
#     Ancak daha kararlı z-score icin 96bar = 24h daha iyi.
#     Compromise: 64bar = 16h (2 seans). OBV spike'inin contextini kapsar.
#
#   zscore_thresh=2.5  → Extreme spike esigi. 1d ile ayni.
#     15m OBV daha sik spike yapar (daha fazla mikro gürültu). Esigi artir: 3.0.
#     Bu daha az ama daha kaliteli sinyal demek.
#
#   body_ratio_min=0.5  → Confirmation engulfing gövde orani. 1d ile ayni.
#     15m'de gurultu nedeniyle engulfing daha sik olusur.
#     0.5 yeterli katilık — degismedi.
#
#   atr_sl_mult=1.0  → SL = entry +/- 1.0 × ATR. Degismedi (oransal).
#     15m'de 1 ATR daha dar — bu iyi (kucuk SL = buyuk R/risk birimi).
#
#   tp_r=1.5  → OBV spike fade mean-reversion hedef: 1.5R. 1d ile ayni.
#     15m'de mean-reversion daha hizli gerceklesir; 1.5R makul.
#     Ablation: 1.0R (kisa hedef, yuksek WR) vs 1.5R vs 2.0R.
#
# NOT: CVD spike fade inherently mean-reversion: 15m'de IDEAL calisma alani.
#       15m spike'lar daha sik, mean-reversion daha hizli — strateji favorileniyor.
#       ANCAK: daha fazla false spike → zscore_thresh artisi kritik.

name: cvd_spike_fade
version: "1.0.0-15m"
description: "OBV z-score spike fade (CVD proxy) — 15m intraday parametreleri. SEC-SCALP-S5."

trend_filter:
  type: none
  period: 50
  required: false         # CVD spike fade trend-bagimsiz (mean-reversion)

signals:
  patterns:
    - id: obv_spike_short
      enabled: true
      weight: 2.0
      params:
        obv_lookback: 64              # 1d=30bar(30gun) → 15m=64bar(16h=2 seans)
        zscore_thresh: 3.0            # 1d=2.5; 15m daha sik spike → esik arttirildi
        body_ratio_min: 0.5           # degismedi

    - id: obv_spike_long
      enabled: true
      weight: 2.0
      params:
        obv_lookback: 64
        zscore_thresh: 3.0
        body_ratio_min: 0.5

  structure:
    swing:
      fractal_n: 2
    support_resistance:
      lookback_bars: 192              # 1d=120bar → 15m=192bar(48h)
      cluster_atr_multiplier: 0.35
      min_touches: 2
      max_age_bars: 192
    require_proximity_to_sr_atr: 0.0

  filters:
    atr_min_pct: 0.002                # 1d=0.003; 15m ATR% kucuk
    volume_zscore_min: 0.0            # OBV spike zaten hacim filtresi; vol_z gerekmez

  confluence:
    method: weighted_sum
    min_score: 1.5
    bonus_if_at_sr: 0.0

risk:
  stop_loss:
    method: atr
    atr_mult: 1.0                     # degismedi; 1.0 ATR SL
  take_profit:
    method: r_multiple
    tp_r: 1.5                         # degismedi; 15m'de mean-reversion 1.5R hedef
  position_sizing:
    method: fixed_fractional
    risk_per_trade: 0.02              # Phase 3 override

backtest:
  warmup_bars: 150                    # OBV lookback + buffer; 150 × 15m = 37.5h
  fees:
    taker: 0.00040
    maker: -0.00010
  slippage_bps: 7.5
  initial_capital_usdt: 10000.0

# TF-spesifik notlar:
#
# CVD spike fade 15m'de olasi en iyi fit strateji:
#   Retail FOMO/panic 15m bar'larda daha belirgin. Spike → reversal latency kisa.
#   1d'de spike sonrasi reversal bazen gunler surebilir; 15m'de 1-4 bar.
#   tp_r=1.5 bu hizli reversal icin optimize.
#
# zscore_thresh 2.5→3.0:
#   15m OBV daha sik ±2.5 asacak. 3.0 ile "gercek extreme"'leri filtrele.
#   Beklenen: 1d'deki kadar sinyal sayisi ama daha yuksek precision.
#   Ablation: 2.5 vs 3.0 vs 3.5.
#
# obv_lookback 30→64:
#   30 bar 15m'de 7.5h — tek seans. 64bar = 16h = 2 seans.
#   Daha uzun pencere: z-score daha istikrarli, extreme daha anlamli.
#   NOT: _obv_zscore rolling() icin O(n) — performans sorunu yok.
#
# OBV proxy sinirlamalari 15m'de:
#   Gercek CVD tick-level veri ister. 15m'de OBV proxy daha zayif
#   (bar kapanisini kullanir; tick buy/sell split bilinmiyor).
#   confirmation bar (engulfing) bu belirsizligi kismen dengeler.
#
# Phase 3 eylem:
#   1. zscore_thresh ablation: 2.5 / 3.0 / 3.5
#   2. tp_r ablation: 1.0 / 1.5 / 2.0 (mean-reversion hizi olcumu)
#   3. 15m'de OBV proxy kalitesini gercek funding/cvd verisi ile karsilastir
