# brooks_failed_breakout — 15m TF manifest override
# Kaynak: SEC-SCALP-S5 / Signal Chief 2026-05-17
#
# Kalibrasyon mantigi:
#   1d ref → 15m esiti (1d = 96 × 15m)
#
#   lookback_period=20bar  → 1d'de 20 gun. 15m'de 20bar = 5h.
#     Brooks: "20-bar high/low = 1 aylik resistance". 15m'de 5h = 1 seans.
#     1 seanslik resistance breakout failure makul. Degismedi: 20bar.
#     NOT: Alternatif 32bar = 8h (gunluk H/L seviyesi gibi). Ablation onerisi.
#
#   max_bars_to_fail=3  → BO'dan 3 bar icinde failure. 1d'de 3 gun.
#     15m'de 3bar = 45 dak. Bu cok kisa (trapped retailler icin 45 dak az).
#     Genislet: 5bar = 75 dak. BO'dan 1.25h icinde failure = trap onaylanir.
#
#   sl_atr_factor=0.5  → SL = BO bar swing high/low + 0.5 ATR. Degismedi.
#     15m'de 0.5 ATR kucuk mesafe — stop hunting riski var.
#     Artir: 0.7 → daha guvenli ama daha buyuk risk/trade.
#
#   kaufman_er_max_trend=0.85  → Cok guclu trend'de reversal alma.
#     1d ile ayni. 15m'de ER daha sik degisir; 0.85 makul.
#     Biraz gevset: 0.90 (sadece COK guclu trendde engelle).
#
#   primary_R=2.0  → 1d'de 2R. 15m'de fee+slip ile 1.5R.
#
#   atr_min_pct=0.005  → 1d'de %0.5. 15m'de %0.5 cok yuksek (15m ATR% < %0.2).
#     Indir: 0.003 → daha cok sinyal, ama vol filtresi dengeler.
#
#   vol_z rolling=60bar → 15m'de 60bar = 15h. 96bar = 24h daha iyi referans.
#     (Kod seviyesinde hardcoded — Phase 4 manifest-driven)
#
# NOT: risk_per_trade tanimsiz — risk_phoenix_scalp_15m.yaml override eder.
# NOT: Brooks failed BO 15m'de mükemmel uyum — retail algo trap siklikla 15m'de olusur.

name: brooks_failed_breakout
version: "1.0.0-15m"
description: "Brooks Failed Breakout / Trap reversal — 15m intraday parametreleri. SEC-SCALP-S5."

trend_filter:
  type: none
  period: 0
  required: false         # Failed BO inherently counter-trend; trend filter yasak

signals:
  patterns:
    - id: bull_trap_short
      enabled: true
      weight: 2.0
      params:
        lookback_period: 20           # degismedi; 20bar = 5h seans resistance/support
        max_bars_to_fail: 5           # 1d=3bar(3gun) → 15m=5bar(75dak=1.25h)
        require_close_beyond: true    # degismedi; close-beyond daha guclu BO gerektirir
        sl_atr_factor: 0.7            # 1d=0.5; 15m'de stop-hunt riski → arttirildi
        tp_method: r_multiple
        primary_R: 1.5                # 1d=2.0; 15m fee+slip ile 1.5R

    - id: bear_trap_long
      enabled: true
      weight: 2.0
      params:
        lookback_period: 20
        max_bars_to_fail: 5
        require_close_beyond: true
        sl_atr_factor: 0.7
        tp_method: r_multiple
        primary_R: 1.5

  structure:
    swing:
      fractal_n: 2
    support_resistance:
      lookback_bars: 192              # 1d=120bar → 15m=192bar(48h)
      cluster_atr_multiplier: 0.35
      min_touches: 2
      max_age_bars: 192
    require_proximity_to_sr_atr: 0.0

  filters:
    atr_min_pct: 0.003                # 1d=0.005; 15m ATR% kucuk → indirildi
    volume_zscore_min: 0.0            # BO bar'da yuksek vol zaten esik icinde; ek filtre yok
    kaufman_er_period: 14             # 14 × 15m = 3.5h; intraday ER
    kaufman_er_max_trend: 0.90        # 1d=0.85; 15m'de trend'e biraz daha tolerans

  confluence:
    method: weighted_sum
    min_score: 2.0                    # 1d ile ayni; Brooks: score > 2.0 zorunlu
    bonus_if_at_sr: 0.0

risk:
  stop_loss:
    method: swing_extreme_plus_atr
    atr_factor: 0.7                   # pattern-level ile tutarli
  take_profit:
    method: r_multiple
    primary_R: 1.5
  position_sizing:
    method: fixed_fractional
    risk_per_trade: 0.02              # Phase 3 override

backtest:
  warmup_bars: 100                    # lookback_period + buffer; 100 × 15m = 25h
  fees:
    taker: 0.00040
    maker: -0.00010
  slippage_bps: 7.5
  initial_capital_usdt: 10000.0

# TF-spesifik notlar:
#
# max_bars_to_fail 3→5 (75 dak):
#   1d'de 3 gun sonra failure = "hizli teslimiyet". 15m'de 45 dak ok kisa.
#   75 dak (5 bar) ile daha fazla failure window = daha fazla sinyal.
#   Risk: 5 bar sonra failure = slippage artabilir. Ablation zorunlu.
#
# sl_atr_factor 0.5→0.7:
#   15m'de 0.5 ATR SL cok dar → noise ile stop-out.
#   0.7 ATR ile daha guvenli SL ama buyuk R/trade.
#   Ablation: 0.5 vs 0.7 vs 1.0 karsilastir.
#
# lookback_period 20 (degismedi):
#   1d'de 20 gun = 1 ay. 15m'de 20 bar = 5h = 1 trading seans.
#   Seans H/L'yi resistance olarak kullanmak Brooks'un "previous day high" fikrine yakin.
#   Alternatifte 32bar = 8h (gunluk H/L). Phase 4 ablation: 20 vs 32 vs 48.
#
# require_close_beyond=True (degismedi):
#   Wick-only BO'ya girmeme = daha az false trap. 15m'de wick sik → Bu korunmali.
#   Eger sinyal sayisi cok dusukse False denenebilir.
#
# Beklenen 15m beklentisi vs 1d:
#   1d WR ~%65-75, avg_R +0.13 (test verisinden). 15m: WR ~%60-65, avg_R ~0.08-0.12.
#   Daha sik sinyal (15m) ama daha dusuk R/trade → net throughput benzer veya hafif dusuk.
#
# Phase 3 eylem:
#   1. max_bars_to_fail ablation: 3 vs 5 vs 7
#   2. sl_atr_factor ablation: 0.5 vs 0.7 vs 1.0
#   3. vol_z_window kodda 60→96 guncelle
#   4. lookback_period=32 alternatifi dene (gunluk H/L semantigi)
