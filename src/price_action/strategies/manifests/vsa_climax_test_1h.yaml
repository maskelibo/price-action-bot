# vsa_climax_test — 1h TF manifest override
# Kaynak: Lab Scientist, SEC-S6 1h pivot feasibility, 2026-05-17
#
# Kalibrasyon: 15m → 1h (zaman koruyarak bar sayıları /4)
#   1h = 4 × 15m bar zaman boyutu.
#   wait_min:    15m=4bar(1h)   → 1h=1bar(1h)    # min 1bar = bekleme = 1 saat
#   wait_max:    15m=24bar(6h)  → 1h=6bar(6h)
#   vol_sma:     15m=40bar(10h) → 1h=10bar(10h)
#   confirm_max: 15m=5bar(75dk) → 1h=2bar(120dk; round up; 75dk < 1bar)
#   vol_sma_mult: 15m=3.0 → 1h=2.7 (1h bar agg vol spike daha az sik)
#   primary_R:    15m=2.5 → 1h=2.8 (1h hold daha uzun, daha buyuk hedef gercekci)
#   low_tolerance_pct: 15m=0.02 → 1h=0.025 (1h granularite biraz daha gevsek)
#   lookback_bars (S/R): 15m=192(48h) → 1h=48bar(48h)
#   max_age_bars: 15m=192 → 1h=48
#
# VSA 1h beklentisi:
#   1h'de SC + Test event 15m'den ~%75 az ama daha yuksek kaliteli.
#   Beklenen: 1h'de gunluk 0-1 sinyal (15m'de gunluk 1-3).

name: vsa_climax_test
version: "1.0.0-1h"
description: "VSA Selling Climax + Test Bar (Wyckoff Phase A) — 1h intraday. SEC-S6."

trend_filter:
  type: ema
  period: 200
  required: false

signals:
  patterns:
    - id: vsa_sc_test_long
      enabled: true
      weight: 2.0
      params:
        spread_atr_mult: 1.5
        vol_sma_mult: 2.7              # 15m=3.0 → 1h=2.7 (1h spike daha az sik)
        close_pos_min: 0.50
        min_low_bars: 5
        wait_min: 1                    # 15m=4bar(1h) → 1h=1bar(1h)
        wait_max: 6                    # 15m=24bar(6h) → 1h=6bar(6h)
        low_tolerance_pct: 0.025       # 15m=0.02 → 1h=0.025
        vol_ratio_max: 0.75
        spread_atr_max: 0.80
        close_pos_min_tb: 0.50

    - id: vsa_bc_thrust_short
      enabled: true
      weight: 2.0
      params:
        spread_atr_mult: 1.5
        vol_sma_mult: 2.7
        close_pos_max: 0.50
        max_high_bars: 5
        wait_min: 1
        wait_max: 6
        high_tolerance_pct: 0.025
        vol_ratio_max: 0.75
        spread_atr_max: 0.80

  structure:
    swing:
      fractal_n: 2
    support_resistance:
      lookback_bars: 48                # 15m=192(48h) → 1h=48bar(48h)
      cluster_atr_multiplier: 0.40     # 15m=0.35 → 1h=0.40 (cluster genis)
      min_touches: 2
      max_age_bars: 48
    require_proximity_to_sr_atr: 0.0

  filters:
    atr_min_pct: 0.003                 # 15m=0.002 → 1h=0.003 (1h ATR% biraz yuksek)
    volume_zscore_min: 0.0

  confluence:
    method: weighted_sum
    min_score: 1.5
    bonus_if_at_sr: 0.0

risk:
  stop_loss:
    method: sc_low_atr
    atr_buffer: 1.0
  take_profit:
    method: r_multiple
    primary_R: 2.8                     # 15m=2.5 → 1h=2.8 (uzun hold + buyuk move)
  position_sizing:
    method: fixed_fractional
    risk_per_trade: 0.02               # Phase 3 override

# vsa_internals: kod bu bloku okur (vol_sma_period, atr_period, confirmation_max_wait)
vsa_internals:
  atr_period: 20                       # 20 × 1h = 20h; 1 trading gun
  vol_sma_period: 10                   # 15m=40(10h) → 1h=10bar(10h)
  confirmation_max_wait: 2             # 15m=5bar(75dk) → 1h=2bar(120dk)  # ÖLÜ: kod okumuyor — callsite'lar geçmez, hardcode 3 (F10). Doğrulandı 2026-07-10

backtest:
  warmup_bars: 50                      # vol_sma + ATR + wait_max + buffer; 50 × 1h = 50h
  fees:
    taker: 0.00040
    maker: -0.00010
  slippage_bps: 6.5                    # 1h: bar boyu ile slippage azalir (15m=7.5 → 1h=6.5)
  initial_capital_usdt: 10000.0
