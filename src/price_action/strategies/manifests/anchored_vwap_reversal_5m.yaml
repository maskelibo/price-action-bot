# ARCHIVED: 5m KILL 2026-05-17 — pool mR ≈ -0.37 at 5y span, fee-structural fail. Keep for reference / future 15m TF calibration baseline.
# anchored_vwap_reversal — 5m TF manifest override
# Kaynak: Signal Chief, SEC-SCALP-S7, 2026-05-17
#
# Kalibrasyon: 15m → 5m (x3)
#   avwap_swing_lookback: 15m=96bar(24h) → 5m=288bar(24h)
#   poc_lookback        : 15m=96bar(24h) → 5m=288bar(24h)
#   primary_R           : 15m=1.5 → 5m=1.2
#   rsi esikler         : 15m'de zaten genisetilmisti; 5m'de ayni tut
#
# PERFORMANS NOTU: _volume_profile_poc O(n*lookback*50bucket).
#   5m'de n=50000+ bar × poc_lookback=288 → CIDDI performans riski.
#   poc_lookback=96 (8h) ile daha kisa pencere: edge korunur, hiz artar.
#   Tradeoff: poc daha "taze" ama daha az robust.
#   Karar: poc_lookback=96bar (8h) — 5m icin en iyi denge.

name: anchored_vwap_reversal
version: "1.0.0-5m"
description: "Anchored VWAP + POC mean-reversion — 5m intraday. SEC-SCALP-S7."

trend_filter:
  type: ema
  period: 50            # 50 x 5m = 250 dak — session bias; opsiyonel
  required: false

signals:
  patterns:
    - id: avwap_long_reversal
      enabled: true
      weight: 1.5
      params:
        poc_atr_tolerance: 1.5          # 15m ile ayni — oransal
        rsi_long_max: 62.0              # 15m=60; 5m RSI hizli sallar → 2puan daha genis
        avwap_swing_lookback: 192       # 15m=96bar(24h) → 5m=192bar(16h) [perf dengesi]
        poc_lookback: 96                # PERF: 288 cok agir; 96bar=8h yeterli

    - id: avwap_short_reversal
      enabled: true
      weight: 1.5
      params:
        poc_atr_tolerance: 1.5
        rsi_short_min: 38.0             # 15m=40; 5m'de daha genis
        avwap_swing_lookback: 192
        poc_lookback: 96

  structure:
    swing:
      fractal_n: 2
    support_resistance:
      lookback_bars: 288                # 5m=288bar(24h)
      cluster_atr_multiplier: 0.35
      min_touches: 2
      max_age_bars: 288
    require_proximity_to_sr_atr: 0.0

  filters:
    atr_min_pct: 0.001                  # 5m ATR% cok kucuk → cok dusuk esik
    volume_zscore_min: 0.5              # 15m ile ayni

  confluence:
    method: weighted_sum
    min_score: 1.5
    bonus_if_at_sr: 0.0

risk:
  stop_loss:
    method: structural_atr
    swing_lookback: 45                  # 15m=15bar → 5m=45bar
    atr_buffer: 1.0
  take_profit:
    method: r_multiple
    primary_R: 1.2                      # 15m=1.5 → 5m=1.2
  position_sizing:
    method: fixed_fractional
    risk_per_trade: 0.01

backtest:
  warmup_bars: 400                      # poc_lookback=96 + avwap=192 + buffer
  fees:
    taker: 0.00040
    maker: -0.00010
  slippage_bps: 8.0
  initial_capital_usdt: 10000.0
