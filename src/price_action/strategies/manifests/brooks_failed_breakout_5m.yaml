# brooks_failed_breakout — 5m TF manifest override
# Kaynak: Signal Chief, SEC-SCALP-S7, 2026-05-17
#
# Kalibrasyon: 15m → 5m (x3)
#   lookback_period : 15m=20bar(5h) → 5m=60bar(5h) [zaman koru — seans H/L]
#   max_bars_to_fail: 15m=5bar(75dk) → 5m=15bar(75dk)
#   sl_atr_factor   : 15m=0.7 → 5m=0.8 [5m'de stop-hunt daha sik]
#   primary_R       : 15m=1.5 → 5m=1.2
#   vol_z_min       : 15m=0.0 → 5m=0.5 [5m'de BO bar hacmi onemli]

name: brooks_failed_breakout
version: "1.0.0-5m"
description: "Brooks Failed Breakout / Trap reversal — 5m intraday. SEC-SCALP-S7."

trend_filter:
  type: none
  period: 0
  required: false

signals:
  patterns:
    - id: bull_trap_short
      enabled: true
      weight: 2.0
      params:
        lookback_period: 60             # 15m=20bar(5h) → 5m=60bar(5h)
        max_bars_to_fail: 15            # 15m=5bar(75dk) → 5m=15bar(75dk)
        require_close_beyond: true
        sl_atr_factor: 0.8              # 15m=0.7 → 5m=0.8 [stop-hunt riski]
        tp_method: r_multiple
        primary_R: 1.2                  # 15m=1.5 → 5m=1.2

    - id: bear_trap_long
      enabled: true
      weight: 2.0
      params:
        lookback_period: 60
        max_bars_to_fail: 15
        require_close_beyond: true
        sl_atr_factor: 0.8
        tp_method: r_multiple
        primary_R: 1.2

  structure:
    swing:
      fractal_n: 2
    support_resistance:
      lookback_bars: 288
      cluster_atr_multiplier: 0.35
      min_touches: 2
      max_age_bars: 288
    require_proximity_to_sr_atr: 0.0

  filters:
    atr_min_pct: 0.001
    volume_zscore_min: 0.5              # 15m=0.0 → 5m=0.5 [BO barda hacim onemli]
    kaufman_er_period: 14
    kaufman_er_max_trend: 0.90          # 15m ile ayni

  confluence:
    method: weighted_sum
    min_score: 2.0                      # ayni; Brooks minimum skor
    bonus_if_at_sr: 0.0

risk:
  stop_loss:
    method: swing_extreme_plus_atr
    atr_factor: 0.8
  take_profit:
    method: r_multiple
    primary_R: 1.2
  position_sizing:
    method: fixed_fractional
    risk_per_trade: 0.01

backtest:
  warmup_bars: 200                      # lookback=60 + buffer
  fees:
    taker: 0.00040
    maker: -0.00010
  slippage_bps: 8.0
  initial_capital_usdt: 10000.0
