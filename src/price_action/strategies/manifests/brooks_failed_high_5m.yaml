# ARCHIVED: 5m RED 2026-05-17 — SEC47 standalone n=114603 mean R -0.411 WR 36.5% (gate +0.10 fail)
# All 5y negatif; bear vs bull spread +0.06 (gate altinda). 22k trade/yr × 0.29R fee burn.
# Keep for reference / 15m TF future calibration baseline.
# brooks_failed_high — 5m TF manifest (S3-B dedicated short-only)
# Kaynak: SEC47 / D5-sec49 / 2026-05-17 — researcher pre-reg HYP-2026-05-17-S3-B
#
# Kalibrasyon mantigi (15m -> 5m TF scaling, brooks_failed_breakout_5m basecase):
#   lookback_period  : 60 (5h seans)    -> failed_breakout_5m ile parite
#   approach_pct     : 0.003 (=%0.3)    -> swing high'a yaklasim mesafesi (BTC ~$200)
#   failure_close_pct: 0.30             -> close bar range'in alt 30% (rejection)
#   require_red_bar  : true             -> close < open (kirmizi failure bar)
#   sl_atr_factor    : 0.8              -> 5m stop-hunt riski (15m=0.7)
#   primary_R        : 1.2              -> 5m fee'ye uygun hizli TP
#   kaufman_er_max   : 0.90             -> cok guclu trend'de no-reversal
#
# UYARI (Renaissance disiplini):
#   5m TF KANITLI fee-grave; brooks_failed_breakout_5m manifest "ARCHIVED"
#   header tasiyor (mR -0.37 5y, sec40 RED kanit zinciri).
#   Bu mirror short-only "failed-approach" (vs "failed-break") farkli mekanik.
#   Honest expected: RED %70-80; pre-reg disiplini icin full test.

name: brooks_failed_high
version: "1.0.0-5m"
description: "Brooks Failed High — short-only failed-approach reversal. 5m. S3-B."

trend_filter:
  type: none
  period: 0
  required: false                       # Failed-high inherently counter-trend

signals:
  patterns:
    - id: failed_high_short
      enabled: true
      weight: 2.0
      params:
        lookback_period: 60             # 5h seans high (failed_breakout_5m parite)
        approach_pct: 0.003             # %0.3 swing high yaklasim
        failure_close_pct: 0.30         # close alt 30% range
        require_red_bar: true
        sl_atr_factor: 0.8              # 5m stop-hunt
        tp_method: r_multiple
        primary_R: 1.2

  structure:
    swing:
      fractal_n: 2
    support_resistance:
      lookback_bars: 288
      cluster_atr_multiplier: 0.35
      min_touches: 2
      max_age_bars: 288
    require_proximity_to_sr_atr: 0.0

  filters:
    atr_min_pct: 0.001
    volume_zscore_min: 0.0              # ablation: 0.5 daha siki secim
    kaufman_er_period: 14
    kaufman_er_max_trend: 0.90

  confluence:
    method: weighted_sum
    min_score: 2.0
    bonus_if_at_sr: 0.0

risk:
  stop_loss:
    method: swing_high_plus_atr
    atr_factor: 0.8
  take_profit:
    method: r_multiple
    primary_R: 1.2
  position_sizing:
    method: fixed_fractional
    risk_per_trade: 0.01                # phoenix_scalp_5m yaml override

backtest:
  warmup_bars: 200                      # lookback=60 + buffer
  fees:
    taker: 0.00040
    maker: -0.00010
  slippage_bps: 8.0
  initial_capital_usdt: 10000.0
