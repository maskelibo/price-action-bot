# macOS newsyslog config — Price Action log rotation
#
# Yükleme: sudo cp ops/logrotate/priceaction.newsyslog.conf /etc/newsyslog.d/
#
# Format: logfilename [owner:group] mode count size when flags
#   count = max rotated copies
#   size  = rotate when file reaches X kB (* = no limit)
#   when  = 24 hour notation (HH) or daily ($D0), weekly ($W0), monthly ($M1)
#   flags = J=bzip2, Z=gzip, G=glob, B=binary

# CEO orchestrator logs (saatlik yazımlar — günlük rotate)
/Users/peyman/price-action-bot/logs/launchd/ceo.stdout.log    peyman:staff  644  7   *    $D0    GZ
/Users/peyman/price-action-bot/logs/launchd/ceo.stderr.log    peyman:staff  644  7   *    $D0    GZ

