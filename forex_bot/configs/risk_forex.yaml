defaults:
  account_currency: USD

position_sizing:
  method: fixed_fractional
  risk_per_trade_pct: 0.015          # 1.5% per trade default
  max_risk_per_trade_pct: 0.03
  use_kelly: false
  kelly_cap: 0.20

leverage:
  max_total_leverage: 30.0           # 1:30 retail-tier default; raise for pro accounts
  max_per_pair_leverage: 10.0

drawdown_breaker:
  daily_loss_pct: 0.05               # 5% daily DD breaker
  weekly_loss_pct: 0.10
  monthly_loss_pct: 0.15
  consecutive_losses: 4
  pause_days: 3

correlation_gate:
  enabled: true
  max_pairwise_corr: 0.70
  reduction_factor: 0.50
  hard_block_at: 0.90

concentration:
  max_open_positions: 6
  max_per_pair_pct: 0.20

execution:
  market_slippage_pips: 0.8
  stop_slippage_pips: 3.0
  commission_per_lot_round_turn_usd: 7.0

news_guard:
  enabled: true
  pre_minutes: 30
  post_minutes: 30
  close_open_positions_on_blackout: true

engine:
  initial_balance_usd: 10000.0
  runner_trail_atr_mult: 1.5
  tp1_close_pct: 0.30
  tp2_close_pct: 0.30
  runner_pct: 0.40
  move_sl_to_be_after_tp1: true
  force_exit_bars: 32                # 8 hours @ 15m

strategies:
  enabled:
    - london_breakout
    - ny_open_reversal
    - asia_range_fade
    - smc_liquidity_sweep
    - ob_retest_continuation
    - fvg_fill
    - pin_bar_session
    - engulfing_session
