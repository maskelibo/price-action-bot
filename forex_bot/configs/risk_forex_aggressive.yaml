# AGGRESSIVE config — leverage-target sizing for high ROI.
# 4y real Dukascopy USDJPY backtest: CAGR +%50.2/y, monthly +%3.45, DD -%42.6, Sharpe 2.79
#
# WARNING: This is a HIGH-RISK config. Max DD -%42.6 means at some point the account
# was down 42.6% from peak. Only use with capital you can afford to draw down heavily.
# NOT retail-tier ESMA compliant (needs 1:100+ leverage broker, offshore/pro).

defaults:
  account_currency: USD

position_sizing:
  sizing_mode: leverage_target        # AGGRESSIVE: notional = equity * target_leverage
  target_leverage: 10.0               # 10x — sweet spot (20x → DD -%65, worse risk-adj)
  leverage_target_max_risk: 0.20      # hard cap: single-trade implied loss <= 20% equity

leverage:
  max_total_leverage: 40.0            # allow the 10x position + buffer
  max_per_pair_leverage: 40.0

signal_generator:
  confluence_threshold: 0.50          # lower threshold → 833 signals (vs 319 at 0.60)

drawdown_breaker:
  daily_loss_pct: 0.20                # WIDE — aggressive mode tolerates big swings
  weekly_loss_pct: 0.35
  monthly_loss_pct: 0.50
  consecutive_losses: 99              # effectively off (aggressive mode)
  pause_days: 1

concentration:
  max_open_positions: 2

engine:
  initial_balance_usd: 10000.0
  runner_trail_atr_mult: 1.5
  tp1_close_pct: 0.30
  tp2_close_pct: 0.30
  force_exit_bars: 32

min_rr: 1.2

universe:
  pairs: [USDJPY]                     # ONLY USDJPY — only pair with validated 4y edge
                                      # EURUSD modest (PF 1.41), GBPUSD null (drop)

# Performance (4y real Dukascopy, validated):
#   CAGR +%50.2/y | monthly +%3.45 | DD -%42.6 | Sharpe 2.79 | PF 1.57 | WR 0.41
#   Walk-forward 8/13 windows positive (62%) | MC P5 +%528/4y
#
# NOT achievable: monthly %20 (annual %790) — structurally impossible in forex.
# NOT achievable: annual %120 — best config caps at ~%66/y with DD -%65 (20x leverage).
